# litellm post-install: wait for the proxy and confirm models loaded.
#
#   scripts/ansible-run.sh litellm
#
- name: litellm post-install
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    litellm_url: "http://litellm.litellm.svc.cluster.local:4000"
    master_key: "{{ lookup('env', 'litellm_master_key') }}"
  tasks:
    - name: Wait for the proxy to be ready
      ansible.builtin.uri:
        url: "{{ litellm_url }}/health/readiness"
        status_code: 200
      register: ready
      until: ready.status == 200
      retries: 30
      delay: 5

    - name: List models
      ansible.builtin.uri:
        url: "{{ litellm_url }}/v1/models"
        headers:
          Authorization: "Bearer {{ master_key }}"
      register: models

    - name: Fail if no models loaded
      ansible.builtin.assert:
        that: models.json.data | length > 0
        fail_msg: "litellm answered but has no models — check the config.yaml ConfigMap"

    - name: Report
      ansible.builtin.debug:
        msg: "litellm: {{ models.json.data | length }} models loaded"
