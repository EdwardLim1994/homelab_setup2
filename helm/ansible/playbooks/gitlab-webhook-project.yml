# Included per-project by gitlab-webhook.yml. `project` = the project dict,
# `wh_action` = register | verify | deregister.
- name: "{{ project.path_with_namespace }} — list hooks"
  ansible.builtin.uri:
    url: "{{ gitlab_api_base }}/projects/{{ project.id }}/hooks"
    method: GET
    headers: { PRIVATE-TOKEN: "{{ gitlab_token }}" }
    return_content: true
    status_code: 200
  register: p_hooks
  no_log: true

- name: "{{ project.path_with_namespace }} — matching hooks"
  ansible.builtin.set_fact:
    p_match: "{{ p_hooks.json | selectattr('url', 'equalto', webhook_url) | list }}"

- name: "{{ project.path_with_namespace }} — fail on duplicates"
  ansible.builtin.fail:
    msg: "{{ p_match | length }} hooks with URL {{ webhook_url }} on {{ project.path_with_namespace }} — remove extras and re-run."
  when: p_match | length > 1

# ponytail: helm/gitlab/values.yaml has registry.enabled: false (no registry
# pod deployed), but new projects still default container_registry_access_level
# to "enabled" — GitLab then tries to reach gitlab-registry.gitlab.svc:5000 on
# project *deletion* (checking for image tags to purge) and the delete fails
# with an unhandled Faraday::ConnectionFailed (DNS lookup fails, no UI error
# shown). Disable it here so it can never bite a project again.
- name: "{{ project.path_with_namespace }} — disable container registry"
  ansible.builtin.uri:
    url: "{{ gitlab_api_base }}/projects/{{ project.id }}"
    method: PUT
    headers: { PRIVATE-TOKEN: "{{ gitlab_token }}" }
    body_format: form-urlencoded
    body:
      container_registry_access_level: disabled
    status_code: [200]
  no_log: true
  when: wh_action == 'register' and project.container_registry_access_level != 'disabled'

- name: "{{ project.path_with_namespace }} — create webhook"
  ansible.builtin.uri:
    url: "{{ gitlab_api_base }}/projects/{{ project.id }}/hooks"
    method: POST
    headers: { PRIVATE-TOKEN: "{{ gitlab_token }}" }
    body_format: json
    body:
      url: "{{ webhook_url }}"
      token: "{{ webhook_secret }}"
      merge_requests_events: true
      pipeline_events: true
      push_events: false
      tag_push_events: false
      issues_events: false
      note_events: false
      job_events: false
      deployment_events: false
      releases_events: false
      enable_ssl_verification: true
    status_code: [201]
  no_log: true
  when: wh_action == 'register' and p_match | length == 0
  register: p_created

- name: "{{ project.path_with_namespace }} — update webhook"
  ansible.builtin.uri:
    url: "{{ gitlab_api_base }}/projects/{{ project.id }}/hooks/{{ p_match[0].id }}"
    method: PUT
    headers: { PRIVATE-TOKEN: "{{ gitlab_token }}" }
    body_format: json
    body:
      url: "{{ webhook_url }}"
      token: "{{ webhook_secret }}"
      merge_requests_events: true
      pipeline_events: true
      push_events: false
      enable_ssl_verification: true
    status_code: [200]
  no_log: true
  when: wh_action == 'register' and p_match | length == 1

- name: "{{ project.path_with_namespace }} — verify"
  ansible.builtin.assert:
    that:
      - p_match | length == 1
      - p_match[0].merge_requests_events | bool
      - p_match[0].pipeline_events | bool
      - not (p_match[0].push_events | bool)
    fail_msg: "{{ project.path_with_namespace }}: webhook missing or wrong ({{ p_match }})"
    success_msg: "{{ project.path_with_namespace }}: webhook ok (id {{ p_match[0].id if p_match else '-' }})"
  when: wh_action == 'verify'

- name: "{{ project.path_with_namespace }} — deregister"
  ansible.builtin.uri:
    url: "{{ gitlab_api_base }}/projects/{{ project.id }}/hooks/{{ p_match[0].id }}"
    method: DELETE
    headers: { PRIVATE-TOKEN: "{{ gitlab_token }}" }
    status_code: [204]
  no_log: true
  when:
    - wh_action == 'deregister'
    - p_match | length == 1
    - deregister_confirmed | bool

- name: "{{ project.path_with_namespace }} — deregister needs confirmation"
  ansible.builtin.fail:
    msg: "re-run with -e deregister_confirmed=true to delete the webhook on {{ project.path_with_namespace }}"
  when:
    - wh_action == 'deregister'
    - p_match | length == 1
    - not (deregister_confirmed | bool)

- name: "{{ project.path_with_namespace }} — result"
  ansible.builtin.debug:
    msg: >-
      {{ project.path_with_namespace }}:
      {{ 'created' if (p_created is defined and p_created is not skipped)
         else ('present' if p_match | length == 1 else 'absent') }}
  when: wh_action == 'register'
