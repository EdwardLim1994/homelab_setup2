# One-time (idempotent, re-run-safe) migration: create a dedicated service
# account per SDLC role in both GitLab and Kaneo, so tickets/MRs can be
# assigned to the role that actually did the work instead of the single
# shared admin identity every omp pod authenticates as.
#
#   scripts/{linux,windows}/ansible-run.* role-accounts
#
# ponytail: GitLab username == role name verbatim (deterministic, lets
# SKILL.md hardcode `--assignee "<role>"` with no lookup). GitLab group
# membership is granted once at the `sdlc` GROUP level -- GitLab cascades
# group membership to every project under it, present and future, so one
# run here covers every generated project forever. Kaneo has no such
# group concept; per-project membership is handled separately in
# F-02-kickoff.json at project-creation time, not here.
#
# Kaneo (Better Auth) gates admin endpoints on a session cookie, not a
# bearer API key -- but that's fully scriptable headlessly: sign in as the
# bootstrap admin (POST /api/auth/sign-in/email) to get a session cookie,
# reuse it to create each role's user (admin plugin), impersonate that role
# to get a session as them, then create an API key under that impersonated
# session. No pods/exec needed (unlike Taiga's old manage.py shell
# approach) -- this is normal in-cluster HTTP.
#
# UNVERIFIED: the exact Better Auth endpoint paths/payloads below
# (sign-in/email, admin/create-user, admin/impersonate-user, api-key/create)
# follow Better Auth's documented plugin conventions but haven't been
# live-verified against Kaneo's pinned image version -- run this once by
# hand for a single role first (see the plan's verification step 1) before
# trusting it for all 12. If it doesn't pan out, fall back to one-time
# manual browser bootstrap per role (same tier of manual step
# `openwebui_api_key` already requires, just x12).
#
# RBAC: pods get/list + pods/exec in `gitlab`
# (terraform/internal/ansible.tf: ansible_gitlab_exec), secrets write in
# `sdlc` and `n8n` (ansible_sdlc_secrets, ansible_n8n_secrets).
- name: Per-role service accounts for GitLab + Kaneo
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    gitlab_ns: gitlab
    sdlc_ns: sdlc
    kaneo_ns: kaneo
    postgres_ns: postgres
    shared_db_password: "{{ lookup('env', 'shared_db_password') }}"
    gitlab_url: >-
      {{ lookup('env', 'GITLAB_URL')
         | default('http://gitlab-webservice-default.gitlab.svc.cluster.local:8181', true) }}
    gitlab_api_base: "{{ gitlab_url }}/api/v4"
    kaneo_url: >-
      {{ lookup('env', 'KANEO_URL')
         | default('http://kaneo.kaneo.svc.cluster.local:5173', true) }}
    kaneo_admin_email: "{{ lookup('env', 'kaneo_admin_email') }}"
    kaneo_admin_password: "{{ lookup('env', 'kaneo_admin_password') }}"
    kaneo_external_url: "{{ lookup('env', 'kaneo_external_url') }}"
    authentik_url: "{{ lookup('env', 'authentik_url') }}"
    group_ref: "{{ lookup('env', 'gitlab_group_id') | default('sdlc', true) }}"
    # ponytail: single source of truth is helm/omp/values.yaml's `roles:`
    # list -- keep these in sync if a role is ever added/removed there.
    sdlc_roles:
      - backend-developer
      - data-engineer
      - devops-engineer
      - frontend-developer
      - product-owner
      - project-manager
      - qa-engineer
      - release-manager
      - security-engineer
      - solution-architect
      - tech-lead
      - uiux-designer

  tasks:
    # --- GitLab: mint a scoped token (same technique as gitlab-webhook.yml) ---
    - name: Find the gitlab webservice pod
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ gitlab_ns }}"
        label_selectors: ["app=webservice"]
        field_selectors: ["status.phase=Running"]
      register: gl_pods
      until: gl_pods.resources | length > 0
      retries: 20
      delay: 15

    - name: Mint a fresh sdlc-role-accounts API token via rails
      kubernetes.core.k8s_exec:
        namespace: "{{ gitlab_ns }}"
        pod: "{{ gl_pods.resources[0].metadata.name }}"
        container: webservice
        command: >-
          /bin/sh -c "cd /srv/gitlab && bundle exec rails runner \"
            u = User.find_by(username: 'root') or abort 'no root user';
            u.personal_access_tokens.where(name: 'sdlc-role-accounts').delete_all;
            t = u.personal_access_tokens.create!(name: 'sdlc-role-accounts', scopes: [:api], expires_at: 1.year.from_now);
            puts %(PAT=#{t.token})
          \""
      register: pat_out
      until: "'PAT=' in (pat_out.stdout | default(''))"
      retries: 4
      delay: 20
      no_log: true

    - name: Extract the token
      ansible.builtin.set_fact:
        gitlab_token: "{{ pat_out.stdout | regex_search('PAT=(\\S+)', '\\1') | first }}"
      no_log: true

    # --- GitLab: resolve (or create) the sdlc group ---
    - name: Look up the group
      ansible.builtin.uri:
        url: "{{ gitlab_api_base }}/groups/{{ group_ref | urlencode }}"
        method: GET
        headers: { PRIVATE-TOKEN: "{{ gitlab_token }}" }
        status_code: [200, 404]
      register: group_get
      no_log: true

    - name: Create the sdlc group
      ansible.builtin.uri:
        url: "{{ gitlab_api_base }}/groups"
        method: POST
        headers: { PRIVATE-TOKEN: "{{ gitlab_token }}" }
        body_format: json
        body: { name: "{{ group_ref }}", path: "{{ group_ref }}", visibility: private }
        status_code: [201]
      register: made_group
      no_log: true
      when: group_get.status == 404

    - name: Resolve group id
      ansible.builtin.set_fact:
        group_id: "{{ made_group.json.id if group_get.status == 404 else group_get.json.id }}"

    # --- GitLab: create one user per role (idempotent) ---
    - name: Check whether each role's GitLab user already exists
      ansible.builtin.uri:
        url: "{{ gitlab_api_base }}/users?username={{ item }}"
        method: GET
        headers: { PRIVATE-TOKEN: "{{ gitlab_token }}" }
        return_content: true
        status_code: [200]
      register: gl_user_checks
      loop: "{{ sdlc_roles }}"
      no_log: true

    - name: Create missing GitLab role users
      ansible.builtin.uri:
        url: "{{ gitlab_api_base }}/users"
        method: POST
        headers: { PRIVATE-TOKEN: "{{ gitlab_token }}" }
        body_format: json
        body:
          username: "{{ item.item }}"
          name: "{{ item.item }}"
          email: "sdlc-{{ item.item }}@homelab.local"
          password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
          skip_confirmation: true
        status_code: [201]
      loop: "{{ gl_user_checks.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: item.json | length == 0
      no_log: true

    - name: Re-resolve every role's GitLab user id
      ansible.builtin.uri:
        url: "{{ gitlab_api_base }}/users?username={{ item }}"
        method: GET
        headers: { PRIVATE-TOKEN: "{{ gitlab_token }}" }
        return_content: true
        status_code: [200]
      register: gl_user_ids
      loop: "{{ sdlc_roles }}"
      loop_control: { label: "{{ item }}" }
      no_log: true

    # --- GitLab: add every role user to the sdlc group (cascades to all projects) ---
    - name: Add each role user to the sdlc group as Developer
      ansible.builtin.uri:
        url: "{{ gitlab_api_base }}/groups/{{ group_id }}/members"
        method: POST
        headers: { PRIVATE-TOKEN: "{{ gitlab_token }}" }
        body_format: form-urlencoded
        body:
          user_id: "{{ item.json[0].id }}"
          access_level: 30
        status_code: [201, 409]
      loop: "{{ gl_user_ids.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: item.json | length > 0
      no_log: true

    # --- GitLab: mint a real personal token per role user (the actual gap
    # this playbook had before -- `--assignee "<role>"` in every SKILL.md
    # only ever set the cosmetic assignee field; every commit/MR was still
    # authored as whichever account var.omp_gitlab_token belongs to, since
    # F-31 had no per-role credential to log in with at all) ---
    - name: List each role user's existing personal access tokens (admin API)
      ansible.builtin.uri:
        url: "{{ gitlab_api_base }}/personal_access_tokens?user_id={{ item.json[0].id }}"
        method: GET
        headers: { PRIVATE-TOKEN: "{{ gitlab_token }}" }
        return_content: true
        status_code: [200]
      register: role_token_checks
      loop: "{{ gl_user_ids.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: item.json | length > 0
      no_log: true

    - name: Revoke any stale sdlc-role-token for each role user (idempotent re-mint)
      ansible.builtin.uri:
        url: "{{ gitlab_api_base }}/personal_access_tokens/{{ tok.id }}"
        method: DELETE
        headers: { PRIVATE-TOKEN: "{{ gitlab_token }}" }
        status_code: [204, 404]
      loop: "{{ role_token_checks.results | default([]) | subelements('json', skip_missing=true) }}"
      loop_control: { label: "{{ pair.0.item.item }}", loop_var: pair }
      vars:
        tok: "{{ pair.1 }}"
      when: pair.1.name == 'sdlc-role-token' and pair.1.revoked == false
      no_log: true

    - name: Mint a fresh personal access token for each role user (admin API)
      ansible.builtin.uri:
        url: "{{ gitlab_api_base }}/users/{{ item.json[0].id }}/personal_access_tokens"
        method: POST
        headers: { PRIVATE-TOKEN: "{{ gitlab_token }}" }
        body_format: json
        body:
          name: sdlc-role-token
          scopes: [api]
        status_code: [201]
      register: role_token_mint
      loop: "{{ gl_user_ids.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: item.json | length > 0
      no_log: true

    - name: Build role -> token map
      ansible.builtin.set_fact:
        role_token_map: "{{ role_token_map | default({}) | combine({ item.item.item: item.json.token }) }}"
      loop: "{{ role_token_mint.results }}"
      loop_control: { label: "{{ item.item.item }}" }
      when: item.json is defined and item.json.token is defined
      no_log: true

    # ponytail: a plain Kubernetes Secret, NOT a Helm value -- these 12
    # tokens are minted fresh by this playbook every run (ansible, not
    # terraform, owns them), so routing them through helm/omp-agent's
    # values.yaml + a `tofu apply` would mean re-plumbing a new TF var +
    # helm value per role AND re-running tofu every time this playbook
    # re-mints. F-31's Build Job Manifest node reads this directly via
    # `secretKeyRef.key: role` (the role name itself, no map/JSON parsing
    # needed in-pod), falling back to the shared omp-agent-secrets token
    # if a role's key is missing (e.g. this playbook was never run yet).
    - name: Write role tokens into the omp-role-gitlab-tokens Secret (sdlc namespace)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: omp-role-gitlab-tokens
            namespace: "{{ sdlc_ns }}"
          stringData: "{{ role_token_map | default({}) }}"
      no_log: true
      when: role_token_map is defined

    # ponytail: secretKeyRef only resolves within its own namespace -- n8n's
    # native MR-review flow (F-04) needs tech-lead's own PAT to act as
    # tech-lead instead of n8n's shared admin token, but n8n runs in
    # namespace `n8n`, not `sdlc`. Mirror the same map there too (RBAC:
    # terraform/internal/ansible.tf's ansible_n8n_secrets).
    - name: Mirror role tokens into the n8n namespace too (for F-04's native MR-review flow)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: omp-role-gitlab-tokens
            namespace: n8n
          stringData: "{{ role_token_map | default({}) }}"
      no_log: true
      when: role_token_map is defined

    # --- Kaneo: local-password admin + per-role users, no OIDC/browser ---
    # ponytail: Kaneo's admin/create-user and sign-in/email both 403 by
    # default (disableLoginForm / disablePasswordRegistration, see
    # helm/kaneo/values.yaml) -- SSO-only was the plan, but every attempt to
    # drive a role's login through its real Authentik account headlessly
    # (raw HTTP, Playwright) hit the same intermittent failure a real
    # browser never did: password check succeeds (Authentik's own event
    # log confirms it) but the session never completes the OAuth
    # continuation back to Kaneo. Root cause not found despite extensive
    # testing (ruled out: account type, headers, HTTP version, network
    # path, request pacing).
    #
    # Fix: re-enable password LOGIN (disableLoginForm: false) while leaving
    # SELF-REGISTRATION blocked (disablePasswordRegistration: true) -- the
    # actual security surface is open signup, not password login for
    # admin-provisioned accounts. admin/create-user is still blocked by
    # disablePasswordRegistration, so role users and the admin's own local
    # credential are upserted directly in Kaneo's postgres database
    # (role=db=kaneo, shared postgres) instead -- bcrypt-hashed the same
    # way Kaneo's own backend does (its bundled bcryptjs, cost 10), so
    # Better Auth's own password verification accepts it transparently.
    # From there the ORIGINAL design works: admin signs in -> impersonates
    # each role -> mints that role's own API key under the impersonated
    # session. No browser, no OIDC, no intermittent failure.
    - name: Find the kaneo pod
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ kaneo_ns }}"
        label_selectors: ["app=kaneo"]
        field_selectors: ["status.phase=Running"]
      register: kaneo_pods
      until: kaneo_pods.resources | length > 0
      retries: 20
      delay: 15

    - name: Find the postgres pod
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ postgres_ns }}"
        label_selectors: ["app=postgres"]
        field_selectors: ["status.phase=Running"]
      register: postgres_pods
      until: postgres_pods.resources | length > 0
      retries: 20
      delay: 15

    - name: Compute bcrypt hash of the Kaneo admin password (Kaneo's own bundled bcryptjs, cost 10)
      kubernetes.core.k8s_exec:
        namespace: "{{ kaneo_ns }}"
        pod: "{{ kaneo_pods.resources[0].metadata.name }}"
        container: kaneo
        command: >-
          /bin/sh -c "cd /app/apps/api && node -e \"require('bcryptjs').hash('{{ kaneo_admin_password }}', 10).then(h=>console.log(h))\""
      register: kaneo_pw_hash_out
      no_log: true

    - name: Extract the bcrypt hash
      ansible.builtin.set_fact:
        kaneo_pw_hash: "{{ kaneo_pw_hash_out.stdout | trim }}"
      no_log: true

    # ponytail: SQL travels base64-encoded -- avoids any nested-quote hell
    # from PostgreSQL's reserved-word "user" table needing double quotes
    # while already inside k8s_exec's own command-string quoting.
    - name: Upsert the Kaneo admin's local credential (idempotent re-mint)
      vars:
        _sql: >-
          INSERT INTO account (id, account_id, provider_id, user_id, password, created_at, updated_at)
          SELECT 'cred-admin-bootstrap', id, 'credential', id, '{{ kaneo_pw_hash }}', now(), now()
          FROM "user" WHERE email='{{ kaneo_admin_email }}'
          ON CONFLICT (id) DO UPDATE SET password = EXCLUDED.password;
      kubernetes.core.k8s_exec:
        namespace: "{{ postgres_ns }}"
        pod: "{{ postgres_pods.resources[0].metadata.name }}"
        container: postgres
        command: >-
          /bin/sh -c "echo {{ _sql | b64encode }} | base64 -d | PGPASSWORD='{{ shared_db_password }}' psql -U kaneo -d kaneo"
      no_log: true

    # ponytail: id defaults to the role name on first creation, but earlier
    # manual OIDC-signup testing already created some of these 12 users
    # with random Better-Auth-generated ids -- ON CONFLICT (email) keeps
    # whichever id the row already has, so RETURNING id and capturing it is
    # required; never assume id == role name downstream.
    - name: Upsert each role's Kaneo user and capture its real id
      vars:
        _sql: >-
          INSERT INTO "user" (id, name, email, email_verified, created_at, updated_at)
          VALUES ('{{ item }}', '{{ item }}', 'sdlc-{{ item }}@homelab.local', true, now(), now())
          ON CONFLICT (email) DO UPDATE SET updated_at = now()
          RETURNING id;
      kubernetes.core.k8s_exec:
        namespace: "{{ postgres_ns }}"
        pod: "{{ postgres_pods.resources[0].metadata.name }}"
        container: postgres
        command: >-
          /bin/sh -c "echo {{ _sql | b64encode }} | base64 -d | PGPASSWORD='{{ shared_db_password }}' psql -tA -U kaneo -d kaneo"
      register: kaneo_user_upsert_out
      loop: "{{ sdlc_roles }}"
      loop_control: { label: "{{ item }}" }
      no_log: true

    - name: Build role -> Kaneo user id map
      ansible.builtin.set_fact:
        kaneo_user_id_map: "{{ kaneo_user_id_map | default({}) | combine({ item.item: (item.stdout | trim) }) }}"
      loop: "{{ kaneo_user_upsert_out.results }}"
      loop_control: { label: "{{ item.item }}" }
      no_log: true

    - name: Sign in as the Kaneo admin (local credential upserted above)
      ansible.builtin.uri:
        url: "{{ kaneo_external_url }}/api/auth/sign-in/email"
        method: POST
        body_format: json
        body: { email: "{{ kaneo_admin_email }}", password: "{{ kaneo_admin_password }}" }
        status_code: [200]
      register: kaneo_signin
      no_log: true

    - name: Extract the admin session cookie
      ansible.builtin.set_fact:
        kaneo_admin_cookie: "__Secure-better-auth.session_token={{ kaneo_signin.cookies['__Secure-better-auth.session_token'] }}"
      no_log: true

    - name: Look up the sdlc Kaneo workspace id
      ansible.builtin.uri:
        url: "{{ kaneo_external_url }}/api/workspace"
        method: GET
        headers: { Authorization: "Bearer {{ lookup('env', 'kaneo_api_token') }}" }
        return_content: true
        status_code: [200]
      register: kaneo_workspaces
      no_log: true

    - name: Resolve sdlc workspace id
      ansible.builtin.set_fact:
        kaneo_sdlc_workspace_id: "{{ (kaneo_workspaces.json | selectattr('slug', 'equalto', 'sdlc') | first).id }}"
      no_log: true

    - name: Admin-invite every role into the sdlc Kaneo workspace
      ansible.builtin.uri:
        url: "{{ kaneo_external_url }}/api/auth/organization/invite-member"
        method: POST
        headers: { Authorization: "Bearer {{ lookup('env', 'kaneo_api_token') }}" }
        body_format: json
        body: { organizationId: "{{ kaneo_sdlc_workspace_id }}", email: "sdlc-{{ item }}@homelab.local", role: member }
        status_code: [200, 400]
      loop: "{{ sdlc_roles }}"
      loop_control: { label: "{{ item }}" }
      no_log: true

    # --- Kaneo: impersonate each role (admin session), accept its invite, mint its key ---
    - name: Impersonate each role's Kaneo user
      ansible.builtin.uri:
        url: "{{ kaneo_external_url }}/api/auth/admin/impersonate-user"
        method: POST
        headers: { Cookie: "{{ kaneo_admin_cookie }}", Origin: "{{ kaneo_external_url }}" }
        body_format: json
        body: { userId: "{{ kaneo_user_id_map[item] }}" }
        status_code: [200]
      register: kaneo_impersonate_out
      loop: "{{ sdlc_roles }}"
      loop_control: { label: "{{ item }}" }
      no_log: false # TEMP DEBUG

    - name: List each impersonated role's pending invitations
      ansible.builtin.uri:
        url: "{{ kaneo_external_url }}/api/auth/organization/list-user-invitations"
        method: GET
        headers: { Cookie: "__Secure-better-auth.session_token={{ item.cookies['__Secure-better-auth.session_token'] }}" }
        return_content: true
        status_code: [200]
      register: kaneo_invites_out
      loop: "{{ kaneo_impersonate_out.results }}"
      loop_control: { label: "{{ item.item }}" }
      no_log: true

    - name: Accept each role's pending sdlc invitation
      ansible.builtin.uri:
        url: "{{ kaneo_external_url }}/api/auth/organization/accept-invitation"
        method: POST
        headers:
          Cookie: "__Secure-better-auth.session_token={{ item.item.cookies['__Secure-better-auth.session_token'] }}"
          Origin: "{{ kaneo_external_url }}"
        body_format: json
        body: { invitationId: "{{ (item.json | selectattr('status', 'equalto', 'pending') | first).id }}" }
        status_code: [200]
      loop: "{{ kaneo_invites_out.results }}"
      loop_control: { label: "{{ item.item.item }}" }
      when: (item.json | selectattr('status', 'equalto', 'pending') | list) | length > 0
      no_log: true

    - name: Mint an API key under each impersonated session
      ansible.builtin.uri:
        url: "{{ kaneo_external_url }}/api/auth/api-key/create"
        method: POST
        headers:
          Cookie: "__Secure-better-auth.session_token={{ item.cookies['__Secure-better-auth.session_token'] }}"
          Origin: "{{ kaneo_external_url }}"
        body_format: json
        body: { name: sdlc-role-key }
        status_code: [200]
      register: kaneo_key_out
      loop: "{{ kaneo_impersonate_out.results }}"
      loop_control: { label: "{{ item.item }}" }
      no_log: true

    - name: Build role -> Kaneo API key map
      ansible.builtin.set_fact:
        kaneo_role_token_map: "{{ kaneo_role_token_map | default({}) | combine({ item.item.item: item.json.key }) }}"
      loop: "{{ kaneo_key_out.results }}"
      loop_control: { label: "{{ item.item.item }}" }
      when: item.json is defined and item.json.key is defined
      no_log: true

    # ponytail: same shape as omp-role-gitlab-tokens — a plain Secret, not a
    # helm value, re-minted fresh by this playbook every run.
    - name: Write role tokens into the omp-role-kaneo-tokens Secret (sdlc namespace)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: omp-role-kaneo-tokens
            namespace: "{{ sdlc_ns }}"
          stringData: "{{ kaneo_role_token_map | default({}) }}"
      no_log: true
      when: kaneo_role_token_map is defined

    - name: Summary
      ansible.builtin.debug:
        msg: >-
          GitLab: {{ sdlc_roles | length }} role user(s) ensured, added to
          group '{{ group_ref }}' (id {{ group_id }}) as Developer.
          Per-role tokens minted: {{ (role_token_map | default({})) | length }}
          -> written to Secret omp-role-gitlab-tokens in namespace {{ sdlc_ns }}.
          Kaneo: per-role API keys minted: {{ (kaneo_role_token_map | default({})) | length }}
          -> written to Secret omp-role-kaneo-tokens in namespace {{ sdlc_ns }}.
