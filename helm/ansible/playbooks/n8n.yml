# n8n post-deploy: owner setup -> mint (or reuse) API key -> seed SDLC flows.
# Replaces the one-time-manual steps (n8n Settings -> API Keys). Idempotent:
# skips owner setup if already done, reuses TF_VAR_n8n_mcp_api_key if set
# instead of minting a new key every run, always re-seeds flows (seed.sh
# upserts by name). Flow JSON lives in helm/ansible/flows/, mounted at /flows.
#
#   scripts/ansible-run.sh n8n
#   scripts/ansible-run.sh n8n --syntax-check     # parse-only self-check
- name: n8n post-deploy
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    n8n_url: "{{ lookup('env', 'N8N_URL') }}"
    owner_email: "{{ lookup('env', 'n8n_owner_email') }}"
    owner_password: "{{ lookup('env', 'n8n_owner_password') }}"
    # ponytail: n8n only ever returns the raw API key once, at creation — so
    # unlike owner setup this can't be "check if it exists, skip" against
    # n8n's own API. Persisted in .env instead (TF_VAR_n8n_mcp_api_key ->
    # ansible-secrets), same as every other credential in this stack.
    persisted_api_key: "{{ lookup('env', 'n8n_mcp_api_key') | default('', true) }}"
  tasks:
    - name: Wait for n8n to answer
      ansible.builtin.uri:
        url: "{{ n8n_url }}/healthz"
        status_code: 200
      register: health
      until: health.status == 200
      retries: 30
      delay: 5

    - name: Read n8n settings
      ansible.builtin.uri:
        url: "{{ n8n_url }}/rest/settings"
      register: settings

    - name: Create owner account (first-run only)
      when: settings.json.data.userManagement.showSetupOnFirstLoad | default(false)
      ansible.builtin.uri:
        url: "{{ n8n_url }}/rest/owner/setup"
        method: POST
        body_format: json
        body:
          email: "{{ owner_email }}"
          firstName: Homelab
          lastName: Admin
          password: "{{ owner_password }}"
        status_code: 200
      register: setup_resp

    - name: Log in (owner already existed)
      when: not (settings.json.data.userManagement.showSetupOnFirstLoad | default(false))
      ansible.builtin.uri:
        url: "{{ n8n_url }}/rest/login"
        method: POST
        body_format: json
        body:
          emailOrLdapLoginId: "{{ owner_email }}"
          password: "{{ owner_password }}"
        status_code: 200
      register: login_resp

    # ponytail: n8n's auth is a single `n8n-auth` cookie on both responses.
    - name: Capture auth cookie
      ansible.builtin.set_fact:
        n8n_auth: "{{ (setup_resp if setup_resp.skipped is not defined else login_resp).cookies['n8n-auth'] }}"

    # ponytail: newer n8n requires an explicit scopes array on api-key creation.
    # Ask the instance what scopes exist rather than hard-coding a list that
    # drifts — 404 on older builds, so tolerate that and fall back to [].
    # Skipped entirely when persisted_api_key is set — the whole point.
    - name: Get available API-key scopes
      when: persisted_api_key | length == 0
      ansible.builtin.uri:
        url: "{{ n8n_url }}/rest/api-keys/scopes"
        headers:
          Cookie: "n8n-auth={{ n8n_auth }}"
        status_code: [200, 404]
      register: scopes_resp

    - name: Mint an API key (first run only — see persisted_api_key)
      when: persisted_api_key | length == 0
      ansible.builtin.uri:
        url: "{{ n8n_url }}/rest/api-keys"
        method: POST
        headers:
          Cookie: "n8n-auth={{ n8n_auth }}"
        body_format: json
        body:
          label: "ansible-managed"
          expiresAt: null
          scopes: "{{ scopes_resp.json.data | default(scopes_resp.json, true) | default([], true) }}"
        status_code: [200, 201]
      register: keyresp

    - name: Use the key
      ansible.builtin.set_fact:
        n8n_api_key: >-
          {{ persisted_api_key if persisted_api_key | length > 0
             else (keyresp.json.data.rawApiKey | default(keyresp.json.data.apiKey)) }}

    - name: Freshly minted — persist this or it'll mint again next run
      when: persisted_api_key | length == 0
      ansible.builtin.debug:
        msg: >-
          New n8n API key minted (n8n never shows the raw value again).
          Add it to .env as TF_VAR_n8n_mcp_api_key, then
          `gen-tfvars.sh && tofu apply -target=kubernetes_secret.ansible_secrets`
          — future runs will reuse it instead of minting a new one:
          {{ n8n_api_key }}

    - name: Seed flows with the existing seed.sh
      ansible.builtin.command: bash /flows/seed.sh
      environment:
        N8N_URL: "{{ n8n_url }}"
        N8N_API_KEY: "{{ n8n_api_key }}"
      register: seed
      changed_when: "'created' in seed.stdout or 'updated' in seed.stdout"

    - name: seed.sh output
      ansible.builtin.debug:
        var: seed.stdout_lines

    # ponytail: the n8n MCP server (helm/mcp-servers) needs an n8n API key for
    # its workflow-management tools. This stack never stores one, so push the
    # freshly minted key into that Deployment's env (RBAC: ansible-mcp-patch).
    - name: Give the n8n MCP server the API key
      kubernetes.core.k8s:
        state: patched
        api_version: apps/v1
        kind: Deployment
        namespace: mcp-servers
        name: mcp-servers-n8n
        definition:
          spec:
            template:
              spec:
                containers:
                  - name: n8n
                    env:
                      - name: N8N_API_KEY
                        value: "{{ n8n_api_key }}"
      no_log: true
      failed_when: false
