# Register (or verify / remove) Taiga's own GitLab integration webhook on
# every project in the `sdlc` GitLab group — separate from gitlab-webhook.yml's
# F-00 SDLC-router hook. Purpose: compliance — tickets moved out of GitLab
# into Taiga, but push/issue/comment activity from GitLab must still show up
# on the Taiga ticket as a history trail (Taiga's own first-party one-way
# GitLab->Taiga integration; see AGENTS.md's "GitLab compliance history").
#
#   scripts/{linux,windows}/ansible-run.* taiga-gitlab-webhook                  # upsert
#   scripts/{linux,windows}/ansible-run.* taiga-gitlab-webhook --tags verify    # read-only
#   scripts/{linux,windows}/ansible-run.* taiga-gitlab-webhook --tags deregister -e deregister_confirmed=true
#   scripts/{linux,windows}/ansible-run.* taiga-gitlab-webhook --syntax-check
#
# ponytail: duplicates gitlab-webhook.yml's PAT-mint/group-resolve blocks
# rather than sharing them — every playbook here is standalone-invocable via
# ansible-run.sh <name>, so a shared include would break that. Not in
# site.yml (bootstrap/DR, same as gitlab-webhook.yml).
#
# Single Taiga project (this repo's "one project in flight" convention, same
# as GITLAB_PROJECT_ID/TAIGA_PROJECT_ID in helm/n8n/values.yaml) — the webhook
# URL/secret Taiga expects is fetched/set ONCE via its project-modules API,
# then that same target is registered on every GitLab project in the group
# (mirrors gitlab-webhook.yml's group-wide model; harmless when there's only
# one project in practice).
#
# Events: push_events/issues_events/note_events -> Taiga's documented GitLab
# integration triggers; everything else off (different flag set from F-00's
# merge_requests_events/pipeline_events — this is a genuinely separate hook).
- name: Taiga GitLab compliance webhook
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    gitlab_ns: gitlab
    gitlab_url: >-
      {{ lookup('env', 'GITLAB_URL')
         | default('http://gitlab-webservice-default.gitlab.svc.cluster.local:8181', true) }}
    gitlab_api_base: "{{ gitlab_url }}/api/v4"
    taiga_url: >-
      {{ lookup('env', 'TAIGA_URL')
         | default('http://taiga-gateway.taiga.svc.cluster.local', true) }}
    taiga_token: "{{ lookup('env', 'taiga_api_token') }}"
    taiga_project_id: "{{ lookup('env', 'taiga_project_id') | default('1', true) }}"
    admin_email: "{{ lookup('env', 'n8n_owner_email') }}"
    group_ref: "{{ lookup('env', 'gitlab_group_id') | default('sdlc', true) }}"
    deregister_confirmed: false
    # register (default) | verify (read-only) | deregister
    wh_action: >-
      {{ 'deregister' if 'deregister' in ansible_run_tags
         else ('verify' if 'verify' in ansible_run_tags else 'register') }}

  tasks:
    - name: Validate Taiga API token
      ansible.builtin.assert:
        that: taiga_token | length > 0
        fail_msg: >
          taiga_api_token is empty. Log into Taiga via the browser (SSO),
          generate an admin API token, set TF_VAR_taiga_api_token in .env,
          run gen-tfvars, then:
            tofu apply -target=kubernetes_secret.ansible_secrets

    - name: Find the gitlab webservice pod
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ gitlab_ns }}"
        label_selectors: ["app=webservice"]
        field_selectors: ["status.phase=Running"]
      register: gl_pods
      until: gl_pods.resources | length > 0
      retries: 20
      delay: 15

    - name: Mint a fresh taiga-gitlab-webhook API token via rails
      kubernetes.core.k8s_exec:
        namespace: "{{ gitlab_ns }}"
        pod: "{{ gl_pods.resources[0].metadata.name }}"
        container: webservice
        command: >-
          /bin/sh -c "cd /srv/gitlab && bundle exec rails runner \"
            u = User.find_by(username: 'root') or abort 'no root user';
            u.personal_access_tokens.where(name: 'taiga-gitlab-webhook').delete_all;
            t = u.personal_access_tokens.create!(name: 'taiga-gitlab-webhook', scopes: [:api], expires_at: 1.year.from_now);
            puts %(PAT=#{t.token})
          \""
      register: pat_out
      until: "'PAT=' in (pat_out.stdout | default(''))"
      retries: 4
      delay: 20
      no_log: true

    - name: Extract the token
      ansible.builtin.set_fact:
        gitlab_token: "{{ pat_out.stdout | regex_search('PAT=(\\S+)', '\\1') | first }}"
      no_log: true

    - name: Allow local-network webhook targets
      ansible.builtin.uri:
        url: "{{ gitlab_api_base }}/application/settings"
        method: PUT
        headers: { PRIVATE-TOKEN: "{{ gitlab_token }}" }
        body_format: json
        body: { allow_local_requests_from_web_hooks_and_services: true }
        status_code: [200]
      no_log: true

    # --- resolve the group (assumed to already exist — gitlab-webhook.yml
    #     creates it; this playbook doesn't duplicate that bootstrap) ---
    - name: Look up the group
      ansible.builtin.uri:
        url: "{{ gitlab_api_base }}/groups/{{ group_ref | urlencode }}"
        method: GET
        headers: { PRIVATE-TOKEN: "{{ gitlab_token }}" }
        status_code: [200, 404]
      register: group_get
      no_log: true

    - name: Fail if the group doesn't exist yet
      ansible.builtin.fail:
        msg: >
          Group '{{ group_ref }}' doesn't exist — run
          `ansible-run.sh gitlab-webhook` first (it bootstraps the group).
      when: group_get.status == 404

    - name: Resolve group id
      ansible.builtin.set_fact:
        group_id: "{{ group_get.json.id }}"

    # --- Taiga side: fetch the webhook URL Taiga expects, set the secret it
    #     will verify GitLab's requests against ---
    - name: Set the Taiga project's GitLab integration secret
      ansible.builtin.uri:
        url: "{{ taiga_url }}/api/v1/projects/{{ taiga_project_id }}/modules"
        method: PATCH
        headers:
          Authorization: "Bearer {{ taiga_token }}"
        body_format: json
        body:
          gitlab:
            secret: "{{ taiga_token }}"
            valid_origin_ips: []
        status_code: [200, 204]
      no_log: true

    - name: Read back the webhook URL Taiga expects
      ansible.builtin.uri:
        url: "{{ taiga_url }}/api/v1/projects/{{ taiga_project_id }}/modules"
        method: GET
        headers:
          Authorization: "Bearer {{ taiga_token }}"
        return_content: true
        status_code: [200]
      register: taiga_modules
      no_log: true

    - name: Resolve webhook target
      ansible.builtin.set_fact:
        webhook_url: "{{ taiga_modules.json.gitlab.webhooks_url }}"
        webhook_secret: "{{ taiga_token }}"

    # --- projects in the group ---
    - name: List projects in the group
      ansible.builtin.uri:
        url: "{{ gitlab_api_base }}/groups/{{ group_id }}/projects?include_subgroups=true&per_page=100&archived=false"
        method: GET
        headers: { PRIVATE-TOKEN: "{{ gitlab_token }}" }
        return_content: true
        status_code: 200
      register: projects
      no_log: true

    - name: Nothing to do yet
      ansible.builtin.debug:
        msg: >
          Group '{{ group_ref }}' (id {{ group_id }}) has no projects. Create
          repos under it (or let the DevOps pod do it at /kickoff) and re-run.
      when: projects.json | length == 0

    - name: "{{ wh_action }} the Taiga compliance webhook on each project"
      ansible.builtin.include_tasks: taiga-gitlab-webhook-project.yml
      loop: "{{ projects.json }}"
      loop_control:
        loop_var: project
        label: "{{ project.path_with_namespace }}"
      when: projects.json | length > 0

    - name: Summary
      ansible.builtin.debug:
        msg: >
          {{ projects.json | length }} project(s) in '{{ group_ref }}';
          Taiga compliance webhook -> {{ webhook_url }}
