# ponytail: the runner is a suspended CronJob used purely as a reusable Job
# template. It never fires on its own (suspend: true AND a schedule that can't
# occur). Trigger a run with scripts/ansible-run.sh, which clones a Job from it.
image: alpine/ansible:2.18.1

# Feb 31 — a date that never exists, so even if un-suspended it stays dormant.
schedule: "0 0 31 2 *"

# k8s deletes the finished Job (and its pod) this many seconds after it ends.
# ponytail: high enough that ansible-run.*'s status poll always sees the
# terminal condition before k8s GCs the Job. Failed Jobs stick around ~1h for
# inspection; ansible-run deletes successful ones itself.
ttlSecondsAfterFinished: 3600

# Default playbook when scripts/ansible-run.sh is called with no argument.
defaultPlaybook: site.yml

# In-cluster n8n endpoint the n8n.yml playbook talks to.
n8nUrl: "http://n8n.n8n.svc:5678"

# In-cluster openwebui endpoint the openwebui.yml playbook talks to.
openwebuiUrl: "http://openwebui.openwebui.svc:8080"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
