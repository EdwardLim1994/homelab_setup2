# ponytail: terraform/Tiltfile do a plain string-replace of __TS_HOST__ across
# this file, so exposing it as a value lets templates/dashboards.yaml reuse the
# substituted host without a second injection path.
tsHost: "__TS_HOST__"
# ponytail: tailnet MagicDNS suffix — dashboards/*.json use https://<app>.__TAILNET_DOMAIN__
# for their nav links now that each app has its own tailscale-operator host.
tailnetDomain: "__TAILNET_DOMAIN__"

grafana:
  # ponytail: chart refuses to render any sensitive key (client_secret,
  # adminPassword, etc.) in plain values as a guard against accidental
  # secret commits. Our placeholder-replacement approach handles this at
  # Tiltfile load time — disable the guard so helm template succeeds.
  assertNoLeakedSecrets: false

  adminPassword: "__GRAFANA_ADMIN_PASSWORD__"

  grafana.ini:
    server:
      root_url: "__APP_URL__"
    auth:
      # ponytail: keep login form so local admin still works as fallback
      disable_login_form: "false"
      # ponytail: Grafana 11+ defaults this false and stops matching an OAuth
      # login to an existing user by email — so when Authentik's `sub` changes
      # (provider re-provisioned on a cluster rebuild), the old user row is
      # orphaned and login dies with "user.sync: unable to create user: user
      # not found". Authentik verifies the email, so matching on it is safe here.
      oauth_allow_insecure_email_lookup: "true"
    auth.generic_oauth:
      enabled: "true"
      name: "Authentik"
      client_id: "__GRAFANA_OIDC_CLIENT_ID__"
      client_secret: "__GRAFANA_OIDC_CLIENT_SECRET__"
      scopes: "openid profile email"
      auth_url: "__AUTHENTIK_URL__/application/o/authorize/"
      # ponytail: token/userinfo use in-cluster DNS — browser never touches
      # these endpoints so no need for the Tailscale HTTPS port here.
      token_url: "http://authentik-server.authentik.svc.cluster.local/application/o/token/"
      api_url: "http://authentik-server.authentik.svc.cluster.local/application/o/userinfo/"
      role_attribute_path: "email == '__ADMIN_EMAIL__' && 'Admin' || 'Viewer'"
      allow_sign_up: "true"

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Mimir
          uid: mimir
          type: prometheus
          url: http://observability-mimir-query-frontend.observability.svc.cluster.local:8080/prometheus
          isDefault: true
          jsonData:
            timeInterval: 15s
        - name: Prometheus
          uid: prometheus
          type: prometheus
          url: http://observability-prometheus-server.observability.svc.cluster.local
          jsonData:
            timeInterval: 15s
        - name: Loki
          uid: loki
          type: loki
          url: http://observability-loki.observability.svc.cluster.local:3100
        - name: Tempo
          uid: tempo
          type: tempo
          url: http://observability-tempo.observability.svc.cluster.local:3100
          jsonData:
            tracesToLogsV2:
              datasourceUid: loki
            serviceMap:
              datasourceUid: mimir

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca-issuer
    hosts:
      - grafana.local
    tls:
      - secretName: grafana.local-tls
        hosts:
          - grafana.local

  persistence:
    enabled: true
    size: 2Gi

  # ponytail: sidecar auto-loads any ConfigMap in this namespace labelled
  # grafana_dashboard. templates/dashboards.yaml emits one per dashboards/*.json.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: observability
      folder: /tmp/dashboards
      provider:
        foldersFromFilesStructure: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# ── Loki ──────────────────────────────────────────────────────────────────────
loki:
  # ponytail: SingleBinary = one pod, no object storage, no kafka, no cache.
  # SimpleScalable (chart default) needs 3 write + 3 read + 3 backend pods —
  # far too heavy for a single-node homelab.
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi

  # ponytail: zero out the scalable-mode components that SingleBinary doesn't use
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  # ponytail: caches need memcached sub-charts — overkill for homelab
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

# ── Tempo ─────────────────────────────────────────────────────────────────────
tempo:
  tempo:
    # ponytail: metrics-generator turns spans into RED metrics (rate/errors/
    # duration) and remote-writes them to Mimir — that's the latency + traffic
    # panels. Needs traces flowing in via OTLP (already wired through Alloy).
    metricsGenerator:
      enabled: true
      remoteWriteUrl: "http://observability-mimir-distributor.observability.svc.cluster.local:8080/api/v1/push"
      processor:
        span_metrics:
          enable_target_info: true
        service_graphs: {}
      storage:
        path: /var/tempo/generator/wal
      traces_storage:
        path: /var/tempo/generator/traces
    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

  persistence:
    enabled: true
    size: 10Gi

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

# ── Mimir ─────────────────────────────────────────────────────────────────────
mimir-distributed:
  # ponytail: chart defaults to ingest-storage architecture (Kafka between
  # distributor and ingester) — one more stateful thing to babysit for no
  # benefit on a single-node homelab. Classic push-based ingesters instead.
  kafka:
    enabled: false

  mimir:
    structuredConfig:
      multitenancy_enabled: false
      # ponytail: usage-stats reporter defaults to its own S3 bucket client
      # regardless of common.storage.backend — fails hard with no S3 endpoint
      # configured. No need for anonymous telemetry on a homelab anyway.
      usage_stats:
        enabled: false
      common:
        storage:
          backend: filesystem
          filesystem:
            dir: /data
      # ponytail: chart's base config hardcodes blocks_storage.backend: s3
      # (for its bundled minio demo) — component-specific config always wins
      # over `common`, so filesystem must be set here explicitly too.
      blocks_storage:
        backend: filesystem
        # ponytail: must differ from tsdb.dir (chart default /data/tsdb) —
        # filesystem.dir is the simulated "bucket", tsdb.dir is local WAL/head.
        filesystem:
          dir: /data/blocks
      # ponytail: chart default compactor.data_dir is "/data", which is a
      # parent of blocks_storage.filesystem.dir above — must be a sibling.
      compactor:
        data_dir: /data/compactor
      ingest_storage:
        enabled: false
      ingester:
        push_grpc_method_enabled: true

  # ponytail: single replicas throughout — no HA, no zone awareness.
  # The rollout_operator and zone-aware replication exist for production
  # multi-zone clusters, not a one-node homelab.
  rollout_operator:
    enabled: false

  ingester:
    replicas: 1
    zoneAwareReplication:
      enabled: false
    persistentVolume:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi

  distributor:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  querier:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  query_frontend:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  compactor:
    replicas: 1
    persistentVolume:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  store_gateway:
    replicas: 1
    zoneAwareReplication:
      enabled: false
    persistentVolume:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  # ponytail: disable optional components not needed for basic metrics ingestion
  alertmanager:
    enabled: false
  ruler:
    enabled: false
  query_scheduler:
    enabled: false
  overrides_exporter:
    enabled: false

  # ponytail: mimir-distributed bundles its own minio subchart for demos;
  # we use the already-deployed MinIO in the minio namespace instead.
  minio:
    enabled: false

# ── Alloy ─────────────────────────────────────────────────────────────────────
alloy:
  alloy:
    # ponytail: extraPorts needed so the Service exposes OTLP endpoints
    # for apps to send traces/metrics/logs to. Without this, only Alloy's
    # own UI port (12345) is in the Service spec.
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP

    configMap:
      content: |
        // ── K8s pod logs → Loki ──────────────────────────────────────────────
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
            target_label  = "app"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://observability-loki.observability.svc.cluster.local:3100/loki/api/v1/push"
          }
        }

        // ── OTLP receiver (apps → Alloy) ─────────────────────────────────────
        otelcol.receiver.otlp "default" {
          http { endpoint = "0.0.0.0:4318" }
          grpc { endpoint = "0.0.0.0:4317" }
          output {
            metrics = [otelcol.exporter.prometheus.mimir.input]
            logs    = [otelcol.exporter.loki.default.input]
            traces  = [otelcol.exporter.otlp.tempo.input]
          }
        }

        // ── OTLP metrics → Mimir ─────────────────────────────────────────────
        otelcol.exporter.prometheus "mimir" {
          forward_to = [prometheus.remote_write.mimir.receiver]
        }

        prometheus.remote_write "mimir" {
          endpoint {
            url = "http://observability-mimir-distributor.observability.svc.cluster.local:8080/api/v1/push"
          }
        }

        // ── OTLP logs → Loki ─────────────────────────────────────────────────
        otelcol.exporter.loki "default" {
          forward_to = [loki.write.default.receiver]
        }

        // ── OTLP traces → Tempo ──────────────────────────────────────────────
        otelcol.exporter.otlp "tempo" {
          client {
            endpoint = "observability-tempo.observability.svc.cluster.local:4317"
            tls { insecure = true }
          }
        }

  clustering:
    enabled: false

  rbac:
    create: true

  serviceAccount:
    create: true

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  server:
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    # ponytail: remote_write to Mimir so metrics survive beyond Prometheus's
    # own retention window and are queryable from Grafana's Mimir datasource.
    remoteWrite:
      - url: "http://observability-mimir-distributor.observability.svc.cluster.local:8080/api/v1/push"
    persistentVolume:
      enabled: true
      size: 10Gi
    # ponytail: 3d not 7d — one node, cadvisor + kube-state + node-exporter +
    # traefik is a lot of series; longer history lives in Mimir via remoteWrite.
    retention: "3d"
    resources:
      requests:
        cpu: 50m
        # ponytail: 512Mi OOMKills mid-WAL-replay -> 503 on every query ->
        # crashloop. WAL replay is the memory peak; 2Gi clears it. Drop back
        # toward 1Gi if the node gets tight.
        memory: 512Mi
      limits:
        memory: 2Gi

  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kube-state-metrics:
    enabled: true
  prometheus-node-exporter:
    enabled: true
