authentik:
  authentik:
    secret_key: ""  # set via terraform variable
    log_level: info
    # ponytail: shared postgres (helm/postgres, db+role `authentik`) and shared
    # redis (helm/redis, logical DB 1 — GitLab keeps DB 0). The goauthentik
    # chart's bundled bitnami subcharts stay off.
    postgresql:
      host: "postgres.postgres.svc.cluster.local"
      name: "authentik"
      user: "authentik"
      password: ""  # set via terraform (shared_db_password)
    redis:
      host: "redis.redis.svc.cluster.local"
      db: 1

  postgresql:
    enabled: false
  redis:
    enabled: false

  server:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: homelab-ca-issuer
      hosts:
        - authentik.local
      tls:
        - secretName: authentik-tls
          hosts:
            - authentik.local

  worker:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi

