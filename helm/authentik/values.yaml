authentik:
  authentik:
    secret_key: ""  # set via terraform variable
    log_level: info
    # ponytail: point at this wrapper chart's own plain postgres:16 /
    # redis:7-alpine StatefulSets (templates/), NOT the goauthentik chart's
    # bundled bitnami subcharts — bitnami sunset the free images. Same pattern
    # as helm/n8n and helm/litellm.
    postgresql:
      host: "authentik-postgres"
      name: "authentik"
      user: "authentik"
      password: ""  # set via terraform variable
    redis:
      host: "authentik-redis"

  # ponytail: bundled bitnami subcharts off — replaced by templates/postgres.yaml
  # + templates/redis.yaml below.
  postgresql:
    enabled: false
  redis:
    enabled: false

  server:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: homelab-ca-issuer
      hosts:
        - authentik.local
      tls:
        - secretName: authentik-tls
          hosts:
            - authentik.local

  worker:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi

# ponytail: consumed by templates/postgres.yaml + templates/redis.yaml (this
# wrapper chart's own templates). Keep db name/user/password in sync with
# authentik.authentik.postgresql above.
postgres:
  image: postgres:16
  database: authentik
  username: authentik
  password: ""  # set via terraform / Tiltfile
  storageSize: 4Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

redis:
  image: redis:7-alpine
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
