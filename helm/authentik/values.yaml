authentik:
  authentik:
    secret_key: ""  # set via terraform variable
    log_level: info
    postgresql:
      host: "authentik-postgresql"
      password: ""  # set via terraform variable

  postgresql:
    enabled: true
    # ponytail: bitnami moved old image tags to bitnamilegacy on docker.io, upgrade image.tag when bumping chart
    image:
      repository: bitnamilegacy/postgresql
    auth:
      password: ""  # set via terraform variable
    primary:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi

  redis:
    enabled: true
    image:
      repository: bitnamilegacy/redis
    master:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi

  server:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: homelab-ca-issuer
      hosts:
        - authentik.local
      tls:
        - secretName: authentik-tls
          hosts:
            - authentik.local

  worker:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi
