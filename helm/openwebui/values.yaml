image:
  repository: ghcr.io/open-webui/open-webui
  tag: main

storageSize: 5Gi

env:
  # ponytail: everything goes through LiteLLM (OpenAI-compatible) — chat models,
  # the opencode agents, and the host Ollama. Direct Ollama is off so there's
  # one gateway to auth and log.
  OPENAI_API_BASE_URL: "http://litellm.litellm.svc.cluster.local:4000"
  # ponytail: LiteLLM master key — fine here, single-user trusted cluster.
  # Swap for a virtual key (LiteLLM UI -> Keys) if this ever gets more users.
  OPENAI_API_KEY: "__LITELLM_MASTER_KEY__"
  OLLAMA_BASE_URL: ""
  ENABLE_OLLAMA_API: "False"

  # OIDC / Authentik
  ENABLE_OAUTH_SIGNUP: "true"
  OAUTH_PROVIDER_NAME: "Authentik"
  OPENID_PROVIDER_URL: "https://__TS_HOST__:8443/application/o/openwebui/.well-known/openid-configuration"
  OAUTH_CLIENT_ID: "__OPENWEBUI_OIDC_CLIENT_ID__"
  OAUTH_CLIENT_SECRET: "__OPENWEBUI_OIDC_CLIENT_SECRET__"
  OAUTH_SCOPES: "openid profile email openwebui_roles"
  ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
  OAUTH_ROLES_CLAIM: "roles"
  OAUTH_ADMIN_ROLES: "admin"
  WEBUI_URL: "https://__TS_HOST__:8452"

  # ponytail: ENABLE_LOGIN_FORM=False — SSO only. First SSO login by admin
  # gets Admin role via openwebui_roles claim from Authentik.
  ENABLE_LOGIN_FORM: "False"
  ENABLE_PERSISTENT_CONFIG: "False"
  RESET_CONFIG_ON_START: "True"

  # ponytail: server-side OIDC calls go to Tailscale HTTPS; SSL_CERT_FILE
  # trusts the homelab self-signed CA mounted from the homelab-ca Secret.
  SSL_CERT_FILE: "/certs/ca.crt"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi
