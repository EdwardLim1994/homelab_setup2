apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      initContainers:
        - name: combine-certs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - python3
            - -c
            - |
              import certifi, os
              with open('/combined/ca.crt', 'wb') as out:
                  with open(certifi.where(), 'rb') as f: out.write(f.read())
                  if os.path.exists('/homelab-ca/ca.crt'):
                      with open('/homelab-ca/ca.crt', 'rb') as f: out.write(f.read())
          volumeMounts:
            - name: homelab-ca
              mountPath: /homelab-ca
              readOnly: true
            - name: combined-ca
              mountPath: /combined
      containers:
        - name: openwebui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - name: combined-ca
              mountPath: /certs
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # ponytail: a cold pod spends ~90s downloading+loading its embedding
          # model before it's actually listening — without this the Service/
          # Ingress route to it the instant the container starts, 502ing until
          # it catches up. failureThreshold*periodSeconds gives ~150s budget.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: homelab-ca
          secret:
            secretName: homelab-ca
            optional: true
        - name: combined-ca
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.storageSize | quote }}
