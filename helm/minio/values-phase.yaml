# ponytail: sit/uat/production only. No OIDC (no reachable Authentik-for-
# discovery path set up here the way values.yaml's does on internal), no
# homelab-CA trust, no local-domain ingress - just object storage. rootUser/
# rootPassword set via terraform `set_sensitive`, not in this file.
minio:
  # ponytail: chart default is the __MINIO_TRUSTED_CA_SECRET__ placeholder
  # (internal substitutes it via terraform); phase clusters have no homelab
  # CA, empty disables the volume mount entirely.
  trustedCertsSecret: ""
  mode: standalone
  replicas: 1
  drivesPerNode: 1
  pools: 1

  persistence:
    size: 2Gi

  ingress:
    enabled: false
  consoleIngress:
    enabled: false

  # ponytail: no ingress here, so this URL is never actually visited - just
  # needs a valid scheme or minio FATALs on boot. values.yaml's __CONSOLE_URL__
  # placeholder is only substituted by terraform/internal/minio.tf; phase
  # clusters' minio.tf doesn't do that substitution, so override here instead.
  environment:
    MINIO_BROWSER_REDIRECT_URL: "http://localhost:9001"
