minio:
  image:
    repository: quay.io/minio/minio
    # ponytail: pinned — newer builds (tried up through RELEASE.2025-09-07)
    # have a regression where the WebUI never shows the SSO login button
    # despite fully correct, live-verified server-side OIDC config. This tag
    # matches a known-working reference project exactly. Re-test on chart/
    # image bumps before moving off it.
    tag: RELEASE.2024-11-07T00-52-20Z

  mode: standalone
  replicas: 1
  drivesPerNode: 1
  pools: 1

  rootUser: admin
  rootPassword: ""  # set via terraform variable

  # ponytail: MinIO does OIDC discovery server-side against Authentik's tailnet
  # HTTPS URL; terraform/coredns.tf points that name at traefik in-cluster with
  # a homelab-CA cert, so MinIO must trust that CA. terraform swaps in the
  # secret name.
  trustedCertsSecret: "__MINIO_TRUSTED_CA_SECRET__"

  # ponytail: chart's post-install job (`mc mb`) creates these. GitLab's
  # consolidated object storage + the CI runner cache all need their bucket
  # to pre-exist — S3 doesn't auto-create. Names must match the buckets in
  # helm/gitlab/values.yaml appConfig + the runner cache config.
  buckets:
    - name: gitlab-runner-cache
    - name: git-lfs
    - name: gitlab-registry
    - name: gitlab-artifacts
    - name: gitlab-uploads
    - name: gitlab-packages
    - name: gitlab-mr-diffs
    - name: gitlab-dependency-proxy
    - name: gitlab-terraform-state
    - name: gitlab-ci-secure-files
    - name: gitlab-backups
    # plan_release/kickoff hand-off: per-role markdown sections + the
    # compiled development-plan.docx, keyed release-reports/<version>/...
    - name: release-reports
    - name: postgres-backups

  persistence:
    size: 8Gi

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

  # ponytail: fixed dev client_id/secret matching the Authentik OAuth2
  # provider created via the API (same one-time-setup pattern as GitLab's).
  # If minio boots before Authentik/tailscale-serve is reachable (e.g. after
  # a full cluster/host restart), the discovery fetch below 502s once and
  # OIDC stays disabled for that pod's lifetime — no retry. Fix: `kubectl
  # rollout restart deploy/minio -n minio` once Authentik is up. Chart has
  # no initContainers hook to wait-for-it automatically (only extraContainers,
  # which doesn't block startup), not worth patching the chart for a homelab.
  environment:
    MINIO_BROWSER: "on"
    MINIO_BROWSER_REDIRECT_URL: "__CONSOLE_URL__"
    MINIO_IDENTITY_OPENID_CONFIG_URL: "__AUTHENTIK_URL__/application/o/minio/.well-known/openid-configuration"
    # MINIO_IDENTITY_OPENID_CLIENT_ID / _CLIENT_SECRET set via terraform (.env)
    MINIO_IDENTITY_OPENID_CLAIM_NAME: "policy"
    MINIO_IDENTITY_OPENID_SCOPES: "openid,profile,email,policy"
    MINIO_IDENTITY_OPENID_REDIRECT_URI: "__CONSOLE_URL__/oauth_callback"
    MINIO_IDENTITY_OPENID_DISPLAY_NAME: "Authentik"

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca-issuer
    hosts:
      - minio.local
    tls:
      - secretName: minio.local-tls
        hosts:
          - minio.local

  consoleIngress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca-issuer
    hosts:
      - minio-console.local
    tls:
      - secretName: minio-console.local-tls
        hosts:
          - minio-console.local
