{{/* No ExternalSecret operator in this cluster (checked terraform/vault.tf — doesn't exist) — plain Secret, values swapped in by terraform/omp-agent.tf via set_sensitive. */}}
apiVersion: v1
kind: Secret
metadata:
  name: omp-agent-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  gitlab_token: {{ .Values.secrets.gitlabToken | quote }}
  claude_code_token: {{ .Values.secrets.claudeCodeToken | quote }}
  gitlab_repo_url: {{ .Values.secrets.gitlabRepoUrl | quote }}
  taiga_token: {{ .Values.secrets.taigaToken | quote }}
  taiga_url: {{ .Values.secrets.taigaUrl | quote }}
  grafana_url: {{ .Values.secrets.grafanaUrl | quote }}
  taiga_mcp_auth_token: {{ .Values.secrets.taigaMcpAuthToken | quote }}
  nextcloud_url: {{ .Values.secrets.nextcloudUrl | quote }}
  nextcloud_user: {{ .Values.secrets.nextcloudUser | quote }}
  nextcloud_password: {{ .Values.secrets.nextcloudPassword | quote }}
  minio_endpoint: {{ .Values.secrets.minioEndpoint | quote }}
  minio_root_user: {{ .Values.secrets.minioRootUser | quote }}
  minio_root_password: {{ .Values.secrets.minioRootPassword | quote }}
