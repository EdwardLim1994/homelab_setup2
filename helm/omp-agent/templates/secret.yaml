{{/* No ExternalSecret operator in this cluster (checked terraform/vault.tf — doesn't exist) — plain Secret, values swapped in by terraform/omp-agent.tf via set_sensitive. */}}
apiVersion: v1
kind: Secret
metadata:
  name: omp-agent-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  gitlab_token: {{ .Values.secrets.gitlabToken | quote }}
  claude_code_token: {{ .Values.secrets.claudeCodeToken | quote }}
  gitlab_repo_url: {{ .Values.secrets.gitlabRepoUrl | quote }}
