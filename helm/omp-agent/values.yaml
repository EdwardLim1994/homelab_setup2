namespace: sdlc

image:
  # ponytail: reuses the image built for helm/omp's (now-decommissioned) standing
  # chat pod — it already bakes in omp + opencode + claude CLIs and every role's
  # skill dir (helm/omp/Dockerfile). registry.homelab/omp:latest was never built
  # anywhere (no Dockerfile in this chart, no build step in terraform/omp-agent.tf)
  # — any Job using it would ImagePullBackOff.
  repository: k3d-registry:5111/omp-box
  tag: dev
  pullPolicy: IfNotPresent

ttlSecondsAfterFinished: 300
backoffLimit: 1

# Populated from .env / terraform at deploy time
secrets:
  gitlabToken: ""
  claudeCodeToken: ""
  gitlabRepoUrl: ""
  taigaToken: ""
  taigaUrl: ""
  grafanaUrl: ""
  # per-caller bearer into the taiga MCP server (mcp-servers-taiga's
  # AUTH_TOKEN) — lets omp pods build an --mcp-config pointing at it.
  taigaMcpAuthToken: ""
  # per-caller bearer into the sonarqube MCP server — same token value as
  # the server's own SONARQUBE_TOKEN (var.sonarqube_mcp_token), SonarQube's
  # HTTP-mode MCP reads auth from the caller's own header, not a separate
  # per-client secret.
  sonarqubeMcpAuthToken: ""
  nextcloudUrl: ""
  nextcloudUser: ""
  nextcloudPassword: ""
  minioEndpoint: ""
  minioRootUser: ""
  minioRootPassword: ""
