{{- if .Values.adapter.enabled }}
{{- /*
  omp-adapter: OpenAI-compatible shim in front of the omp pods so
  LiteLLM can list them as models. Script is helm/omp/adapter/server.py,
  mounted from a ConfigMap into a plain python image — no image build.
  Own ServiceAccount + Role so it can scale role pods to 1 on first request.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-adapter
  namespace: {{ .Release.Namespace }}
data:
  server.py: |
{{ .Files.Get "adapter/server.py" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-adapter
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-adapter
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-adapter
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-adapter
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-adapter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-adapter
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-adapter
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-adapter
    spec:
      serviceAccountName: {{ .Release.Name }}-adapter
      containers:
        - name: adapter
          image: {{ .Values.adapter.image | quote }}
          command: ["python", "/app/server.py"]
          env:
            - name: PORT
              value: {{ .Values.adapter.port | quote }}
            - name: OMP_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: OMP_PORT
              value: {{ .Values.port | quote }}
            - name: OMP_MODELS
              value: "omp,{{ range $i, $r := .Values.roles }}{{ if $i }},{{ end }}omp-{{ $r }}{{ end }}"
          ports:
            - containerPort: {{ .Values.adapter.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.adapter.port }}
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: app
          configMap:
            name: {{ .Release.Name }}-adapter
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-adapter
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-adapter
  ports:
    - name: http
      port: {{ .Values.adapter.port }}
      targetPort: {{ .Values.adapter.port }}
{{- end }}
