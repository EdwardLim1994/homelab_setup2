{{- if gt (int .Values.slots.count) 0 }}
{{- /*
  Spawn pool: N pre-created omp Deployments at replicas=0. n8n's
  spawn-agent flow claims a free one by PATCHing its replicas to 1 and its
  fetch-skills initContainer args to the wanted skills repo — no manifest
  duplicated in n8n, the chart still owns the pod spec.
  ponytail: fixed pool, not unbounded per-name pods — each omp pod is
  512Mi-2Gi and this is a homelab. Raise slots.count, or switch the flow to
  POST full Deployments, if you outgrow it.
*/ -}}
{{- range $i := until (int .Values.slots.count) }}
{{- $name := printf "%s-slot-%d" $.Release.Name (add $i 1) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $name }}
    omp.slot: "free"
spec:
  replicas: 0
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      {{- include "omp.podSpec" (dict
            "root" $
            "skillsRepo" $.Values.slots.defaultSkillsRepo
            "workspaceClaim" ""
          ) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: {{ $.Values.port }}
      targetPort: {{ $.Values.port }}
{{- end }}
{{- end }}
