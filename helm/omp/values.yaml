# ponytail: one Deployment + Service + PVC. No HPA, no ServiceAccount, no
# Ingress until something needs them.
image: omp-box:dev

# ponytail: scale-to-zero by default = "waked on demand". Wake it with
#   kubectl -n omp scale deploy/omp --replicas=1
# and let it idle back to 0 (cron, or by hand). Swap in KEDA http-add-on
# only if you want an inbound request to trigger the wake.
replicas: 0

# ponytail: keep `port` and the pod-openai shim's PORT in sync — single knob.
# The pod runs pod-openai.py (OpenAI-compatible API backed by a persistent
# `omp --mode rpc` session). Interactive TUI is still `kubectl exec -it
# deploy/omp -- omp`.
port: 4096
command: ["python3"]
args: ["/opt/pod-openai.py"]

env: {}

# ponytail: Secret (key CLAUDE_CODE_OAUTH_TOKEN) mounted as envFrom into every
# omp pod — used when a pod runs the `claude` CLI instead of omp. The Tiltfile
# creates it from TF_VAR_claude_code_token in .env. Set secretName: "" to drop
# the mount entirely.
claudeAuth:
  secretName: omp-claude-auth

# ponytail: git URL of a skills repo (layout: skills/<name>/SKILL.md, same as
# caveman/ponytail). When set, an initContainer clones it and the main
# container copies skills/* into omp's skill dir on start — on top of the
# caveman/ponytail skills already baked into the image. Empty = image skills
# only. This is the per-agent knob a spawned pod overrides.
skillsRepo: ""

# ponytail: pre-created scale-to-zero pods the spawn-agent flow claims. Each
# renders with the fetch-skills initContainer already wired (cloning
# defaultSkillsRepo); the flow PATCHes replicas=1 + that initContainer's
# args to the repo it actually wants. Point defaultSkillsRepo at the
# homelab skills repo once it exists.
slots:
  count: 3
  # ponytail: in-cluster clone URL — pods reach GitLab by Service DNS, not the
  # tailnet name (no SSH exposed, and the tailnet round-trips out and back).
  # Private repo: prefix creds, e.g.
  #   http://oauth2:<project-access-token>@gitlab-webservice-default.gitlab.svc:8181/<group>/<repo>.git
  defaultSkillsRepo: "http://gitlab-webservice-default.gitlab.svc:8181/EdwardLim1994/internal-agent-skills.git"

# ponytail: one Deployment+Service+ConfigMap per role. Base = the same omp
# image; the role's roles/<name>/SKILL.md (in this chart) is mounted into the
# skill dir via ConfigMap — no git clone. All at replicas 0; wake one:
#   kubectl -n omp scale deploy/omp-<role> --replicas=1
# Drop a name from this list to stop shipping that role's pod.
roles:
  - backend-developer
  - data-engineer
  - devops-engineer
  - frontend-developer
  - product-owner
  - project-manager
  - qa-engineer
  - release-manager
  - security-engineer
  - solution-architect
  - tech-lead
  - uiux-designer

# ponytail: scale-to-zero waker + flat proxy (helm/omp/adapter/server.py) so
# LiteLLM can list the omp pods as models. The pods already serve an
# OpenAI-compatible API (pod-openai.py); the adapter only scales a role pod to
# 1 on first request and presents one /v1 surface. Register in LiteLLM: model
# omp[-<role>], api_base http://omp-adapter.omp.svc:8000/v1.
adapter:
  enabled: true
  image: python:3.12-slim
  port: 8000

persistence:
  enabled: true
  size: 20Gi

# ponytail: mount the host's docker socket instead of running a dind daemon
# in-pod (no privileged container). Switch to sysbox/dind if you need real
# isolation between this pod and the host's other containers.
dockerSocket:
  enabled: true
  hostPath: /var/run/docker.sock

# ponytail: RBAC so an external service (n8n) can spawn/kill extra omp
# Deployments in this namespace via the k8s API. Bound to n8n's SA. Ships
# once with the base `omp` release; per-agent spawns are plain Deployments
# the flow POSTs, not new Helm releases.
spawner:
  enabled: true
  subjectServiceAccount:
    name: n8n
    namespace: n8n

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi
