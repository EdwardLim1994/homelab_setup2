{{- if .Values.spawner.enabled }}
# ponytail: lets n8n's ServiceAccount create/kill extra opencode Deployments
# in this namespace through the k8s API — no kubectl binary in the n8n image,
# n8n's HTTP Request node talks to https://kubernetes.default.svc directly.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-spawner
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-spawner
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.spawner.subjectServiceAccount.name }}
    namespace: {{ .Values.spawner.subjectServiceAccount.namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-spawner
  apiGroup: rbac.authorization.k8s.io
{{- end }}
