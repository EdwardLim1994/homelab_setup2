{{- /*
  Per-role pods: one Deployment + Service + ConfigMap per entry in
  .Values.roles. The ConfigMap carries that role's roles/<name>/SKILL.md
  (shipped in this chart), mounted into the opencode skill dir on top of the
  image's baked caveman/ponytail skills — no git clone, unlike the slot pool.
  ponytail: all at replicas 0 (12 roles x 512Mi-2Gi). Wake one with
    kubectl -n opencode scale deploy/opencode-<role> --replicas=1
*/ -}}
{{- range $role := .Values.roles }}
{{- $skill := $.Files.Get (printf "roles/%s/SKILL.md" $role) | required (printf "roles/%s/SKILL.md missing" $role) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-role-{{ $role }}
  namespace: {{ $.Release.Namespace }}
data:
  SKILL.md: |
{{ $skill | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}-{{ $role }}
    opencode.role: {{ $role }}
spec:
  replicas: 0
  selector:
    matchLabels:
      app: {{ $.Release.Name }}-{{ $role }}
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}-{{ $role }}
    spec:
      {{- include "opencode.podSpec" (dict
            "root" $
            "skillsRepo" ""
            "workspaceClaim" ""
            "roleSkill" $role
          ) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
  namespace: {{ $.Release.Namespace }}
spec:
  selector:
    app: {{ $.Release.Name }}-{{ $role }}
  ports:
    - name: http
      port: {{ $.Values.port }}
      targetPort: {{ $.Values.port }}
{{- end }}
