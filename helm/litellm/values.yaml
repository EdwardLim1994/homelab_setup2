image:
  repository: ghcr.io/berriai/litellm
  tag: main-latest

# ponytail: per-caller bearer for the gitlab MCP server (its
# STREAMABLE_HTTP_AUTH_TOKEN). Same value as TF_VAR_gitlab_mcp_auth_token.
mcpGitlabAuthToken: "__GITLAB_MCP_AUTH_TOKEN__"

# ponytail: SonarQube user token LiteLLM forwards to the sonarqube MCP server
# as `Authorization: Bearer` (HTTP mode needs it per request). Same value as
# TF_VAR_sonarqube_mcp_token.
mcpSonarqubeAuthToken: "__SONARQUBE_MCP_TOKEN__"

# ponytail: per-caller bearer for the n8n MCP server (its AUTH_TOKEN).
# Same value as TF_VAR_n8n_mcp_auth_token.
mcpN8nAuthToken: "__N8N_MCP_AUTH_TOKEN__"

# ponytail: the host's Ollama, reached from the cluster via k3d's built-in
# host alias. `ollama_chat/*` provider — no /v1 suffix. `ollamaModels` are the
# tags listed by name; add/remove to match `ollama list`.
# host.docker.internal resolves from k3d pods on Docker Desktop; host.k3d.internal
# depends on k3d's flaky CoreDNS NodeHosts injection and was failing name lookup.
ollamaBaseUrl: "http://host.docker.internal:11434"
ollamaModels:
  # qwen3-coder-next (80B) OOMs on this host — omp default is qwen3.8:27b.
  - "qwen3.8:27b"
  - "qwen3:1.7b"

env:
  DATABASE_URL: "postgresql://litellm:__SHARED_DB_PASSWORD__@postgres.postgres.svc.cluster.local:5432/litellm"
  STORE_MODEL_IN_DB: "True"
  LITELLM_MASTER_KEY: "__LITELLM_MASTER_KEY__"
  LITELLM_SALT_KEY: "__LITELLM_SALT_KEY__"

  # SSO via Authentik generic OIDC
  GENERIC_CLIENT_ID: "__LITELLM_OIDC_CLIENT_ID__"
  GENERIC_CLIENT_SECRET: "__LITELLM_OIDC_CLIENT_SECRET__"
  # ponytail: browser-navigated endpoint must use Tailscale HTTPS (external).
  # Token and userinfo are server-side calls — use in-cluster HTTP to avoid
  # self-signed cert validation against homelab CA.
  GENERIC_AUTHORIZATION_ENDPOINT: "__AUTHENTIK_URL__/application/o/authorize/"
  GENERIC_TOKEN_ENDPOINT: "http://authentik-server.authentik.svc.cluster.local/application/o/token/"
  GENERIC_USERINFO_ENDPOINT: "http://authentik-server.authentik.svc.cluster.local/application/o/userinfo/"
  GENERIC_SCOPE: "openid profile email litellm_role"
  GENERIC_USER_ROLE_ATTRIBUTE: "litellm_role"
  PROXY_BASE_URL: "__APP_URL__"
  PROXY_LOGOUT_URL: "__AUTHENTIK_URL__/application/o/litellm/end-session/"
  AUTO_REDIRECT_UI_LOGIN_TO_SSO: "true"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

# ponytail: one LiteLLM pass-through route per omp role pod
# (/omp-<role> -> omp-<role>.omp.svc:4096). Duplicated from
# helm/omp/values.yaml `roles:` — n8n can't read that chart. Keep in sync,
# or drop a name here to stop routing to it.
ompRoles:
  - backend-developer
  - data-engineer
  - devops-engineer
  - frontend-developer
  - product-owner
  - project-manager
  - qa-engineer
  - release-manager
  - security-engineer
  - solution-architect
  - tech-lead
  - uiux-designer

