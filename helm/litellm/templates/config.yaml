# ponytail: LiteLLM proxy config. model_list here + any DB models
# (STORE_MODEL_IN_DB=True) merge at startup — this file guarantees a working
# model list even on a fresh DB.
#
# Only the host's currently-pulled Ollama models are listed (ollamaModels,
# named entries — no wildcard, so an unpulled tag 404s instead of silently
# "working"). omp pods pick their own model directly against Ollama (see
# helm/omp-agent role ConfigMaps' OMP_MODEL) — they aren't LiteLLM-routed.
# The old per-role omp/omp-<role> model_list + pass_through_endpoints (one
# scale-to-zero Deployment per role, via omp-adapter) is gone: superseded by
# helm/omp-agent's ephemeral per-story Jobs, which have no stable Service for
# LiteLLM to point at.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    model_list:
      {{- range $m := .Values.ollamaModels }}
      - model_name: {{ $m.name | quote }}
        litellm_params:
          model: "ollama_chat/{{ $m.name }}"
          api_base: {{ $.Values.ollamaBaseUrl | quote }}
          input_cost_per_token: {{ $m.inputCostPerToken }}
          output_cost_per_token: {{ $m.outputCostPerToken }}
      {{- end }}

    # ponytail: the servers from helm/mcp-servers. Paths assume each image's
    # default MCP route (/mcp for streamable-http). Adjust `url`
    # if an image serves it elsewhere. Only gitlab needs a per-caller bearer
    # (its STREAMABLE_HTTP_AUTH_TOKEN); the rest carry their upstream token in
    # the server pod's own env.
    mcp_servers:
      grafana:
        url: "http://mcp-servers-grafana.mcp-servers.svc.cluster.local:8000/mcp"
        transport: "http"
        description: "Grafana / observability"
      sonarqube:
        url: "http://mcp-servers-sonarqube.mcp-servers.svc.cluster.local:8080/mcp"
        transport: "http"
        description: "SonarQube code quality"
        # ponytail: HTTP-mode sonarqube-mcp wants the SonarQube token per request
        # (Authorization: Bearer), not from its own env. Same token as
        # TF_VAR_sonarqube_mcp_token / the server's SONARQUBE_TOKEN.
        auth_type: "bearer_token"
        auth_value: {{ .Values.mcpSonarqubeAuthToken | quote }}
      gitlab:
        url: "http://mcp-servers-gitlab.mcp-servers.svc.cluster.local:3002/mcp"
        transport: "http"
        description: "GitLab API"
        auth_type: "bearer_token"
        auth_value: {{ .Values.mcpGitlabAuthToken | quote }}
      playwright:
        url: "http://mcp-servers-playwright.mcp-servers.svc.cluster.local:8931/mcp"
        transport: "http"
        description: "Playwright browser automation"
      n8n:
        url: "http://mcp-servers-n8n.mcp-servers.svc.cluster.local:3000/mcp"
        transport: "http"
        description: "n8n workflow docs + management"
        auth_type: "bearer_token"
        auth_value: {{ .Values.mcpN8nAuthToken | quote }}

    general_settings:
      pass_through_endpoints:
        - path: "/omp"
          target: "http://omp.omp.svc.cluster.local:4096"
          include_subpath: true
          forward_headers: true
          methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
