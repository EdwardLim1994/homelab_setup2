{{- range $name, $srv := .Values.servers }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $.Release.Name }}-{{ $name }}
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}-{{ $name }}
    spec:
      {{- with $srv.waitFor }}
      {{- $parts := splitList ":" . }}
      initContainers:
        - name: wait-for-dep
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ index $parts 0 }} {{ index $parts 1 }}; do echo waiting for {{ . }}; sleep 2; done"]
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $srv.image }}
          {{- with $srv.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with $srv.args }}
          args: {{ toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ $srv.port }}
          livenessProbe:
            tcpSocket:
              port: {{ $srv.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: {{ $srv.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          {{- with $srv.env }}
          env:
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml ($srv.resources | default $.Values.defaultResources) | nindent 12 }}
---
{{- end }}
