# ponytail: one Deployment+Service template looped over this map instead of
# 5 near-identical template files — every server here is the same shape
# (image, optional command/args override, one HTTP port, env vars).
defaultResources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

servers:
  grafana:
    image: grafana/mcp-grafana:latest
    # ponytail: override the image's baked entrypoint flags
    # (`--transport sse --address 0.0.0.0:8000`) so `args` is the whole set.
    command: ["/app/mcp-grafana"]
    # ponytail: -allowed-hosts "*" — LiteLLM's MCP client connects by Service
    # DNS, so mcp-grafana's DNS-rebind Host-header check 403s it otherwise.
    # "*" is safe here: only in-cluster traffic can reach :8000.
    args: ["-transport", "streamable-http", "-address", "0.0.0.0:8000", "-allowed-hosts", "*", "-allowed-origins", "*"]
    port: 8000
    env:
      GRAFANA_URL: http://observability-grafana.observability.svc.cluster.local
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ""  # set via terraform

  sonarqube:
    image: sonarsource/sonarqube-mcp:latest
    port: 8080
    # ponytail: after a full cluster/host reboot this pod starts before the
    # sonarqube-sonarqube JVM (slow boot) is listening — crashes hard
    # (version-check connect refused) instead of retrying. Block on it.
    waitFor: "sonarqube-sonarqube.sonarqube.svc.cluster.local:9000"
    # ponytail: JVM server + downloads analyzer plugins on boot — OOMKills
    # (exit 137, CrashLoopBackOff) at the 256Mi default. 1Gi limit gives the
    # container-aware JVM enough headroom; drop it if analyzer set shrinks.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    env:
      SONARQUBE_TRANSPORT: "http"
      SONARQUBE_HTTP_PORT: "8080"
      SONARQUBE_HTTP_HOST: "0.0.0.0"
      SONARQUBE_MCP_IN_CONTAINER: "true"
      SONARQUBE_URL: http://sonarqube-sonarqube.sonarqube.svc.cluster.local:9000
      # ponytail: used only for this server's background plugin sync. In HTTP
      # mode the per-request token comes from the caller's `Authorization:
      # Bearer` header (LiteLLM sends it — see helm/litellm mcpSonarqubeAuthToken).
      # Must be a VALID SonarQube user token or bg init logs "Not authorized".
      SONARQUBE_TOKEN: ""  # set via terraform (TF_VAR_sonarqube_mcp_token)

  gitlab:
    # ponytail: NOT mcp/gitlab (Docker's own catalog wrapper, stdio-only) —
    # this is the actual zereight/gitlab-mcp project, which supports HTTP
    # transport via env vars.
    image: zereight050/gitlab-mcp:latest
    port: 3002
    env:
      STREAMABLE_HTTP: "true"
      HOST: "0.0.0.0"
      PORT: "3002"
      # ponytail: without this the /mcp DNS-rebind guard 403s any request whose
      # Host header isn't loopback — LiteLLM connects by this Service DNS name.
      MCP_SERVER_URL: "http://mcp-servers-gitlab.mcp-servers.svc.cluster.local:3002"
      GITLAB_API_URL: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/api/v4
      GITLAB_PERSONAL_ACCESS_TOKEN: ""  # set via terraform
      # ponytail: server holds a static PAT (not per-client OAuth), so this
      # is the "who's allowed to call this server" bearer token — required
      # by the image whenever STREAMABLE_HTTP + a static PAT are combined.
      STREAMABLE_HTTP_AUTH_TOKEN: ""  # set via terraform

  n8n:
    # ponytail: czlonkowski/n8n-mcp — node docs + workflow validation always,
    # plus workflow-management tools when N8N_API_KEY is set. The key is minted
    # at runtime by playbooks/n8n.yml (this stack never stores one), which
    # patches it into this Deployment's env — blank here = docs-only until then.
    image: ghcr.io/czlonkowski/n8n-mcp:latest
    port: 3000
    env:
      MCP_MODE: "http"
      PORT: "3000"
      # n8n-mcp refuses to start in http mode without this (per-request bearer).
      AUTH_TOKEN: ""  # set via terraform (TF_VAR_n8n_mcp_auth_token)
      N8N_API_URL: http://n8n.n8n.svc.cluster.local:5678
      N8N_API_KEY: ""  # patched in by playbooks/n8n.yml after it mints a key
      LOG_LEVEL: warn

  taiga:
    # ponytail: custom image (no maintained Taiga MCP server exists) — built
    # by terraform/internal/mcp-servers.tf's null_resource. See
    # helm/mcp-servers/taiga-mcp/ for source.
    image: k3d-registry:5111/taiga-mcp:dev
    port: 8300
    env:
      PORT: "8300"
      TAIGA_URL: ""  # set via terraform
      TAIGA_TOKEN: ""  # set via terraform (TF_VAR_taiga_api_token)
      # per-caller bearer, same role as gitlab's STREAMABLE_HTTP_AUTH_TOKEN
      AUTH_TOKEN: ""  # set via terraform (TF_VAR_taiga_mcp_auth_token)

  playwright:
    image: mcr.microsoft.com/playwright/mcp:latest
    command: ["node", "/app/cli.js"]
    # ponytail: --allowed-hosts "*" — same DNS-rebind guard as the others; the
    # server otherwise 403s anything not hitting it as localhost:8931.
    args: ["--headless", "--browser", "chromium", "--no-sandbox", "--port", "8931", "--host", "0.0.0.0", "--allowed-hosts", "*"]
    port: 8931
    # ponytail: real chromium instance, not a thin API wrapper — needs more
    # than the other servers' default resources.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi
