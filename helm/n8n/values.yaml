n8n:
  # ponytail: postgres (external) instead of sqlite — sqlite's single-writer
  # lock stalls under the SDLC flows' concurrent webhook fan-out. Connects to
  # the shared postgres (helm/postgres), database + role `n8n`.
  db:
    type: postgresdb
  externalPostgresql:
    host: postgres.postgres.svc.cluster.local
    port: 5432
    username: n8n
    database: n8n
    password: ""  # set via Tiltfile/terraform (shared_db_password)

  main:
    persistence:
      enabled: true
      # ponytail: chart defaults this to "helm.sh/resource-policy: keep",
      # which makes Tilt refuse to recreate the PVC after a manual delete
      # (e.g. wiping it to reset the encryption key) — drop it so Tilt fully
      # owns the PVC lifecycle like every other app's storage in this repo.
      annotations: {}
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        # ponytail: 512Mi wasn't enough headroom for Node's heap on top of
        # n8n's own footprint — OOMKilled with "JavaScript heap out of memory"
        memory: 1Gi

    # ponytail: chart's 1s default probe timeout is too tight on this RPi
    # under load (6 apps running concurrently) — caused a liveness-kill
    # restart loop even though n8n was actually up. Same fix as sonarqube/
    # seafile-mariadb's probe timeouts.
    livenessProbe:
      timeoutSeconds: 10
    readinessProbe:
      timeoutSeconds: 10

    # ponytail: n8n gates native OIDC/SSO behind an Enterprise license.
    # cweagans/n8n-oidc (MIT) bolts it on via n8n's external-hooks system
    # instead — no license, no fork, just a JS file + env vars. hooks.js is
    # mounted from a ConfigMap the Tiltfile builds from helm/n8n/hooks.js.
    volumes:
      - name: oidc-hooks
        configMap:
          name: n8n-oidc-hooks
      # ponytail: homelab-ca Secret — optional so Tilt (no tailnet ingress,
      # no coredns rewrite, OIDC_ISSUER_URL stays plain) still boots without
      # it. See terraform/n8n.tf for the copy-in + NODE_EXTRA_CA_CERTS below.
      - name: homelab-ca
        secret:
          secretName: homelab-ca
          optional: true
    volumeMounts:
      - name: oidc-hooks
        mountPath: /hooks
        readOnly: true
      - name: homelab-ca
        mountPath: /homelab-ca
        readOnly: true

    # ponytail: fixed dev client_id/secret matching the Authentik OAuth2
    # provider created via the API (same one-time-setup pattern as the
    # other apps'). OIDC_ISSUER_URL uses the tailscale hostname so the
    # server-side discovery fetch and the browser redirect agree on the
    # same authority — same reasoning as minio/gitlab's OIDC wiring.
    extraEnvVars:
      # ponytail: unbounded execution history was piling up (191 rows found
      # manually cleaned once) — prune anything finished older than 7 days,
      # capped at 10k rows regardless of age.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "10000"
      # ponytail: n8n 2.0 disables executeCommand + localFileTrigger by default
      # (NODES_EXCLUDE defaults to that pair). The SDLC flows are built on
      # executeCommand — without this, seeded flows fail to activate and a
      # manual run 502s. "[]" re-enables all. Revisit if these flows ever stop
      # shelling out (GitLab REST node instead of glab, k8s API instead of kubectl).
      NODES_EXCLUDE: "[]"
      # ponytail: flows call sibling flows by webhook (…/spawn-role, …/dod-check).
      # In-cluster self-call over localhost — no proxy round-trip, no tailnet.
      N8N_WEBHOOK_BASE: "http://localhost:5678/webhook"
      # F-28 mm-chat: LiteLLM base + key so the chat flow can POST
      # /v1/chat/completions against the `omp` model (always-on omp pod via
      # omp-adapter). LITELLM_MASTER_KEY injected by terraform set_sensitive.
      LITELLM_BASE: "http://litellm.litellm.svc.cluster.local:4000"
      # ponytail: every SDLC flow's "Notify: ..." nodes POST progress here.
      # NOT OpenWebUI directly — OpenWebUI Functions can't register custom
      # FastAPI routes (confirmed against its function loader source), so
      # sdlc_pipe.py's old push-callback design (/api/v1/pipe/callback) was
      # dead code and never worked. Instead this posts to n8n's own F-29 sink
      # flow (self-call, matching N8N_WEBHOOK_BASE below), which inserts into
      # the sdlc_flow_progress Postgres table; sdlc_pipe.py polls F-30 to read
      # it back. Var name kept as-is — every flow's Notify node reads it, a
      # rename would mean touching all of them for no benefit.
      OPENWEBUI_CALLBACK_URL: "http://localhost:5678/webhook/flow-progress"
      # the SDLC flows + F-28 read config from $env in expressions; n8n blocks
      # that by default.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # F-00 verifies the GitLab webhook's X-GitLab-Token against this. Must
      # match what playbooks/gitlab-webhook.yml registers the hook with.
      # GITLAB_WEBHOOK_SECRET injected by terraform set_sensitive.
      EXTERNAL_HOOK_FILES: "/hooks/hooks.js"
      N8N_ADDITIONAL_NON_UI_ROUTES: "auth"
      EXTERNAL_FRONTEND_HOOKS_URLS: "/assets/oidc-frontend-hook.js"
      N8N_PROTOCOL: "https"
      # __APP_URL__ / __AUTHENTIK_URL__ are string-replaced by terraform/Tiltfile
      # with this app's and Authentik's tailscale-operator MagicDNS URLs
      # (https://n8n.<tailnet>.ts.net etc).
      N8N_EDITOR_BASE_URL: "__APP_URL__/"
      WEBHOOK_URL: "__APP_URL__/"
      OIDC_ISSUER_URL: "__AUTHENTIK_URL__/application/o/n8n/"
      # OIDC_CLIENT_ID / OIDC_CLIENT_SECRET set via Tiltfile/terraform (.env)
      OIDC_REDIRECT_URI: "__APP_URL__/auth/oidc/callback"

# ponytail: flow seeding (and n8n owner setup + API-key minting) moved to the
# ansible runner — helm/ansible/flows/ + playbooks/n8n.yml. Run it with
# `scripts/ansible-run.sh n8n`.
