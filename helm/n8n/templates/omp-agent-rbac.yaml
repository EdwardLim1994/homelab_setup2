{{/*
Lets n8n's own ServiceAccount create/inspect omp-agent Jobs in the sdlc
namespace (n8n itself, not the Job pods — those use omp-agent's own SA,
see helm/omp-agent/templates/role.yaml). n8n subchart default SA name is
release-fullname ("n8n" for this release) — verify with
`kubectl get sa -n n8n` if this release is ever renamed.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: n8n-omp-agent
  namespace: sdlc
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get"]
  # ponytail: needed to find the Job's pod and read its output once finished —
  # the Job resource itself doesn't carry the omp/opencode CLI's stdout.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: n8n-omp-agent
  namespace: sdlc
subjects:
  - kind: ServiceAccount
    name: n8n
    namespace: n8n
roleRef:
  kind: Role
  name: n8n-omp-agent
  apiGroup: rbac.authorization.k8s.io
