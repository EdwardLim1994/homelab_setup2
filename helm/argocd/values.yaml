argo-cd:
  # ponytail: Dex is an OIDC proxy that ArgoCD bundles for providers that
  # don't support OIDC natively. Authentik speaks OIDC directly, so Dex is
  # dead weight here.
  dex:
    enabled: false

  # ponytail: notifications controller is off — no alerting infra in this
  # homelab. Enable when you wire up Slack/email webhooks.
  notifications:
    enabled: false

  server:
    # ponytail: Traefik terminates TLS at the ingress; ArgoCD server runs
    # plain HTTP internally. Without --insecure the server redirects to its
    # own HTTPS port which Traefik never sends traffic to.
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: homelab-ca-issuer
      hosts:
        - argocd.local
      tls:
        - secretName: argocd.local-tls
          hosts:
            - argocd.local
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    # ponytail: oidc.config's issuer must stay the external tailnet URL (it's
    # what Authentik puts in the token's `iss` claim and what the browser
    # redirects to) — ArgoCD's built-in OIDC client has no split
    # discovery-vs-browser endpoint like gitlab/grafana/litellm use, so unlike
    # them argocd-server must actually trust the homelab CA to fetch
    # .well-known/openid-configuration over that tailnet HTTPS (coredns.tf
    # rewrites it to in-cluster traefik, which serves a homelab-CA cert).
    # Same combine-and-overwrite-the-system-bundle trick as openwebui's
    # init container, targeted at the Debian path Go's x509 reads by default
    # (so this doesn't clobber public-CA trust for git-over-HTTPS etc, unlike
    # setting SSL_CERT_FILE, which replaces rather than appends on Go/Linux).
    volumes:
      - name: homelab-ca
        secret:
          secretName: homelab-ca
          optional: true
      - name: combined-ca
        emptyDir: {}
    initContainers:
      - name: combine-certs
        image: alpine:3
        command:
          - sh
          - -c
          - |
            apk add --no-cache ca-certificates >/dev/null 2>&1
            cp /etc/ssl/certs/ca-certificates.crt /combined/ca-certificates.crt
            [ -f /homelab-ca/ca.crt ] && cat /homelab-ca/ca.crt >> /combined/ca-certificates.crt
            exit 0
        volumeMounts:
          - name: homelab-ca
            mountPath: /homelab-ca
            readOnly: true
          - name: combined-ca
            mountPath: /combined
    volumeMounts:
      - name: combined-ca
        mountPath: /etc/ssl/certs/ca-certificates.crt
        subPath: ca-certificates.crt

  controller:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 512Mi

  repoServer:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  applicationSet:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

  redis:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

  configs:
    params:
      # ponytail: run HTTP internally; Traefik ingress handles TLS termination
      server.insecure: true

    cm:
      # ponytail: url must match the external Tailscale URL — ArgoCD embeds
      # it in the OIDC redirect_uri sent to Authentik. Wrong url = callback
      # mismatch error after login.
      url: "__APP_URL__"
      # ponytail: oidc.config drives ArgoCD's built-in OIDC client (no Dex).
      # clientSecret is plain text here (ConfigMap, not Secret) because helm
      # template base64-encodes Secret values before rendered.replace() runs —
      # the placeholder would never match. Homelab trade-off: acceptable.
      oidc.config: |
        name: Authentik
        issuer: __AUTHENTIK_URL__/application/o/argocd/
        clientID: __ARGOCD_OIDC_CLIENT_ID__
        clientSecret: __ARGOCD_OIDC_CLIENT_SECRET__
        requestedScopes:
          - openid
          - profile
          - email

    rbac:
      # ponytail: scopes tells ArgoCD which OIDC token claims to use as group
      # subjects for RBAC matching. '[email]' means policy.csv entries like
      # "g, user@example.com, role:admin" match against the email claim.
      scopes: '[email]'
      policy.default: role:readonly
      policy.csv: |
        g, __ADMIN_EMAIL__, role:admin
