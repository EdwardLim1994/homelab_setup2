nx-cloud:
  global:
    # ponytail: set via Tiltfile/terraform; placeholder here
    nxCloudAppURL: ""
    mongodbConnectionString:
      secretName: nx-cloud-secrets
      secretKey: NX_CLOUD_MONGO_SERVER_ENDPOINT

  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: homelab-ca-issuer
    host: nx-cloud.local
    tls:
      enabled: true
      secretName: nx-cloud.local-tls
      hosts:
        - nx-cloud.local

  # ponytail: file server disabled — S3 (minio) used instead via api env vars.
  # awsS3.* was removed in chart 1.0.0; env vars on api.deployment are the replacement.
  fileServer:
    enabled: false

  api:
    valkey:
      clientProvider: "redisson"
      useSentinel: false
      # ponytail: service name from bitnami valkey standalone = <release>-valkey-primary
      primaryAddress: "nx-cloud-valkey-primary"
      port: 6379
      username: "default"
      passwordSecret:
        name: nx-cloud-secrets
        key: VALKEY_PASSWORD
    deployment:
      env:
        AWS_S3_BUCKET: "nx-cloud"
        AWS_S3_ENDPOINT: "http://minio.minio.svc.cluster.local:9000"
        # ponytail: minio requires path-style URLs
        AWS_S3_ENABLE_PATH_STYLE_ACCESS: "TRUE"
        # ponytail: required for late-2025 nx-api builds; any non-empty value works for non-AWS endpoints
        AWS_REGION: "us-east-1"
        AWS_DEFAULT_REGION: "us-east-1"
        # ponytail: S3 creds injected as plain env (not k8s Secret) via Tiltfile helm set.
        # Keeps them out of Tilt's secret redaction list — short values like "admin"
        # would otherwise get redacted from unrelated command output (e.g. promote-admin.sh).
        AWS_S3_ACCESS_KEY_ID: ""
        AWS_S3_SECRET_ACCESS_KEY: ""
      resources:
        requests:
          cpu: 200m
          memory: 512Mi

  frontend:
    deployment:
      env:
        # ponytail: internal service name, not the ingress host
        NX_API_INTERNAL_BASE_URL: "http://nx-cloud-nx-api-service"
      envValueFrom:
        # ponytail: SAML_ENTRY_POINT + SAML_CERT injected via nx-cloud-secrets.
        # Set TF_VAR_nx_cloud_saml_cert in .env (Authentik IdP signing cert PEM).
        # SAML_ENTRY_POINT is constructed from TS_HOST in Tiltfile.
        # Empty values = SAML SSO disabled until .env is configured.
        SAML_ENTRY_POINT:
          secretKeyRef:
            name: nx-cloud-secrets
            key: SAML_ENTRY_POINT
            optional: true
        SAML_CERT:
          secretKeyRef:
            name: nx-cloud-secrets
            key: SAML_CERT
            optional: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi

  aggregator:
    cronjob:
      env:
        NX_CLOUD_LOG_OUTPUT_FORMAT: "json"
      envValueFrom:
        ADMIN_PASSWORD:
          secretKeyRef:
            name: nx-cloud-secrets
            key: ADMIN_PASSWORD
      resources:
        requests:
          cpu: 200m
          memory: 512Mi

mongodb:
  architecture: replicaset
  replicaCount: 1
  arbiter:
    enabled: false
  auth:
    enabled: true
    rootPassword: ""  # set via Tiltfile/terraform
    databases:
      - nx-cloud
    usernames:
      - nx-cloud
    passwords:
      - ""  # set via Tiltfile/terraform
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  persistence:
    size: 8Gi
  # ponytail: nx-api writes to `nrwl-api` db (hardcoded), user is created on `nx-cloud` db.
  # Grant runs on fresh PVC init only — existing PVC already has the grant applied manually.
  initdbScripts:
    grant-nrwl-api.js: |
      db = db.getSiblingDB('nx-cloud');
      db.grantRolesToUser('nx-cloud', [{role: 'readWrite', db: 'nrwl-api'}]);

valkey:
  architecture: standalone
  auth:
    enabled: true
    password: ""  # set via Tiltfile/terraform
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  primary:
    persistence:
      enabled: false
