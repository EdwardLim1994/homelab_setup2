apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - port: 8065
      targetPort: 8065
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      securityContext:
        # mattermost image runs as uid 2000; make the PVC writable for it
        fsGroup: 2000
      initContainers:
        - name: combine-certs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - sh
            - -c
            - |
              cat /etc/ssl/certs/ca-certificates.crt /homelab-ca/ca.crt > /combined/ca.crt 2>/dev/null \
                || cp /etc/ssl/certs/ca-certificates.crt /combined/ca.crt
          volumeMounts:
            - name: homelab-ca
              mountPath: /homelab-ca
              readOnly: true
            - name: combined-ca
              mountPath: /combined
      containers:
        - name: mattermost
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8065
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /mattermost/data
            - name: config
              mountPath: /mattermost/config
            - name: logs
              mountPath: /mattermost/logs
            - name: plugins
              mountPath: /mattermost/plugins
            - name: client-plugins
              mountPath: /mattermost/client/plugins
            - name: combined-ca
              mountPath: /certs
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: plugins
          emptyDir: {}
        - name: client-plugins
          emptyDir: {}
        - name: homelab-ca
          secret:
            secretName: homelab-ca
            optional: true
        - name: combined-ca
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.storageSize | quote }}
