image:
  repository: mattermost/mattermost-team-edition
  tag: "10.5"

storageSize: 5Gi

env:
  # DB — plain postgres:16 StatefulSet from templates/postgres.yaml (same
  # pattern as helm/n8n). Keep creds in sync with the `postgres:` block below.
  MM_SQLSETTINGS_DRIVERNAME: "postgres"
  MM_SQLSETTINGS_DATASOURCE: "postgres://mattermost:__MM_DB_PASSWORD__@mattermost-postgres:5432/mattermost?sslmode=disable&connect_timeout=10"

  MM_SERVICESETTINGS_SITEURL: "__APP_URL__"
  MM_SERVICESETTINGS_LISTENADDRESS: ":8065"

  # File storage -> MinIO S3 (same server-to-server pattern GitLab uses:
  # root creds, plain http on the in-cluster endpoint). Bucket 'mattermost'
  # is pre-created by helm/minio (S3 doesn't auto-create). Region must be
  # empty for non-AWS S3.
  MM_FILESETTINGS_DRIVERNAME: "amazons3"
  MM_FILESETTINGS_AMAZONS3BUCKET: "mattermost"
  MM_FILESETTINGS_AMAZONS3ENDPOINT: "minio.minio.svc.cluster.local:9000"
  MM_FILESETTINGS_AMAZONS3ACCESSKEYID: "admin"
  MM_FILESETTINGS_AMAZONS3SECRETACCESSKEY: "__MINIO_ROOT_PASSWORD__"
  MM_FILESETTINGS_AMAZONS3REGION: ""
  MM_FILESETTINGS_AMAZONS3SSL: "false"

  # ponytail: local mode = a root Unix socket mmctl talks to with no auth, full
  # admin. playbooks/mattermost.yml uses it to create the bot + outgoing webhook
  # (works around OIDC-only login having no password). Outgoing webhooks feed
  # flow F-28 (chat with omp).
  MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
  MM_SERVICESETTINGS_ENABLEOUTGOINGWEBHOOKS: "true"
  # the sdlc-svc service user (mattermost.yml) needs a personal access token —
  # bots can't be created in local mode.
  MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"

  # ponytail: hosted test push gateway — works with the official store app, no
  # license, no keys. Rate-limited and best-effort; for reliable push either
  # buy HPNS (https://push.mattermost.com) or self-host mattermost-push-proxy
  # with a custom-built app. Fine for a homelab.
  MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS: "true"
  MM_EMAILSETTINGS_PUSHNOTIFICATIONSERVER: "https://push-test.mattermost.com"
  MM_EMAILSETTINGS_PUSHNOTIFICATIONCONTENTS: "full"

  # ponytail: Authentik is the ONLY auth method — email signup/signin off, so
  # the login page shows just the "GitLab" (Authentik) button. First Authentik
  # user to log in becomes Mattermost system admin (Mattermost's own rule).
  MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL: "false"
  MM_EMAILSETTINGS_ENABLESIGNINWITHEMAIL: "false"
  MM_EMAILSETTINGS_ENABLESIGNINWITHUSERNAME: "false"
  MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"

  # Authentik via Mattermost's GitLab-format OAuth (generic OIDC endpoints).
  # Mattermost sends no scope param; Authentik grants every property mapping
  # bound to the provider, including the "Mattermost profile claim" mapping
  # (provision-app-providers.py) that returns the numeric `id` Mattermost needs.
  MM_GITLABSETTINGS_ENABLE: "true"
  MM_GITLABSETTINGS_ID: "__MATTERMOST_OIDC_CLIENT_ID__"
  MM_GITLABSETTINGS_SECRET: "__MATTERMOST_OIDC_CLIENT_SECRET__"
  MM_GITLABSETTINGS_AUTHENDPOINT: "__AUTHENTIK_URL__/application/o/authorize/"
  MM_GITLABSETTINGS_TOKENENDPOINT: "__AUTHENTIK_URL__/application/o/token/"
  MM_GITLABSETTINGS_USERAPIENDPOINT: "__AUTHENTIK_URL__/application/o/userinfo/"

  # ponytail: server-side OAuth calls (token/userinfo) go to Tailscale HTTPS.
  # Mattermost is Go — SSL_CERT_FILE points at the combined bundle the
  # init container builds (system CAs + homelab self-signed CA).
  SSL_CERT_FILE: "/certs/ca.crt"

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

# consumed by templates/postgres.yaml — keep in sync with MM_SQLSETTINGS_DATASOURCE.
postgres:
  image: postgres:16
  database: mattermost
  username: mattermost
  password: "__MM_DB_PASSWORD__"  # string-replaced by Tiltfile/terraform
  storageSize: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
