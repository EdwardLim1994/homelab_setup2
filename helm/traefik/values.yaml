# ponytail: only used on the sit/uat/production phase clusters. The
# "internal" cluster keeps k3s's own bundled traefik (kube-system) - unrelated
# terraform/cert-manager/coredns wiring already depends on that one, don't
# touch it. Phase clusters have k3s's traefik add-on disabled at cluster
# creation (create-cluster.sh --k3s-arg disable=traefik) so this one owns
# ports 80/443 instead.
traefik:
  deployment:
    replicas: 1

  service:
    type: LoadBalancer

  ports:
    web:
      port: 80
    websecure:
      port: 443
