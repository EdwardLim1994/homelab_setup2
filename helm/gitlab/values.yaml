gitlab:
  global:
    edition: ce
    hosts:
      domain: gitlab.local
      # ponytail: without this, hostname defaults to "gitlab.<domain>" i.e.
      # gitlab.gitlab.local (domain already includes "gitlab")
      gitlab:
        name: gitlab.local
    initialRootPassword:
      secret: ""  # set via terraform
    ingress:
      enabled: true
      # ponytail: helm template has no live cluster to auto-detect API
      # versions from; same class of issue as the pdb/hpa overrides above
      apiVersion: networking.k8s.io/v1
      provider: traefik
      class: traefik
      annotations:
        cert-manager.io/cluster-issuer: homelab-ca-issuer
      tls:
        enabled: true
        secretName: gitlab-tls
      # ponytail: defaults true independent of ingress.enabled, keeps
      # spawning a cert-manager issuer job; we manage our own ClusterIssuer
      configureCertmanager: false
    # ponytail: backed by the standalone minio app (helm/minio), not the
    # gitlab chart's own bundled minio subchart (global.minio stays
    # disabled below) — connection secret wired in gitlab/Tiltfile.
    # Per-feature blocks below must leave `connection` empty and only set
    # `bucket` for the chart to treat object_store.connection as the
    # consolidated one they all inherit (see charts/gitlab/_objectStorage.tpl).
    appConfig:
      object_store:
        enabled: true
      lfs:
        enabled: true
        bucket: git-lfs
      artifacts:
        enabled: true
        bucket: gitlab-artifacts
      uploads:
        enabled: true
        bucket: gitlab-uploads
      packages:
        enabled: true
        bucket: gitlab-packages
      externalDiffs:
        enabled: true
        bucket: gitlab-mr-diffs
      dependencyProxy:
        enabled: true
        bucket: gitlab-dependency-proxy
      terraformState:
        enabled: true
        bucket: gitlab-terraform-state
      ciSecureFiles:
        enabled: true
        bucket: gitlab-ci-secure-files
      backups:
        bucket: gitlab-backups
    minio:
      enabled: false
    kas:
      enabled: false
    # ponytail: Tilt's helm() runs `helm template` with no cluster connection,
    # so Capabilities-based API auto-detection can't run and falls back to the
    # long-removed policy/v1beta1 PDB kind. Pin explicitly.
    pdb:
      apiVersion: policy/v1
    hpa:
      apiVersion: autoscaling/v2
    # ponytail: gitlab-shell's SSH IngressRouteTCP only renders once
    # ingress.provider is traefik; same live-cluster-detection gap as above,
    # this cluster's Traefik (v3) only registers the newer traefik.io group
    traefik:
      apiVersion: traefik.io/v1alpha1

  # disable non-essential components
  registry:
    enabled: false
  certmanager:
    install: false
  nginx-ingress:
    enabled: false
  # ponytail: no ingress means no external hostname for the runner to register
  # against (dial fails on gitlab.gitlab.local); CI isn't needed for dev testing
  gitlab-runner:
    install: false
  prometheus:
    install: false
  grafana:
    enabled: false
  gitlab:
    toolbox:
      enabled: false
    webservice:
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          memory: 2Gi
    sidekiq:
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 1Gi
    gitaly:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
    gitlab-shell:
      minReplicas: 1
      maxReplicas: 1

  postgresql:
    install: true
    # ponytail: bitnami moved old image tags to bitnamilegacy on docker.io, upgrade image.tag when bumping chart
    image:
      repository: bitnamilegacy/postgresql
    metrics:
      image:
        repository: bitnamilegacy/postgres-exporter
    primary:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi

  redis:
    install: true
    # ponytail: chart's pinned 6.2.7 tag is amd64-only in bitnamilegacy; pinned to a same-minor tag with arm64 support
    image:
      repository: bitnamilegacy/redis
      tag: 6.2.16-debian-12-r3
    metrics:
      image:
        repository: bitnamilegacy/redis-exporter
        tag: 1.76.0-debian-12-r0
    master:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
