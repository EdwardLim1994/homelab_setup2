gitlab:
  global:
    edition: ce
    hosts:
      domain: gitlab.local
      # ponytail: without this, hostname defaults to "gitlab.<domain>" i.e.
      # gitlab.gitlab.local (domain already includes "gitlab")
      gitlab:
        name: gitlab.local
    initialRootPassword:
      secret: ""  # set via terraform

    # ponytail: re-enabled for CI docker-build/push (F-09/.gitlab-ci.yml need
    # a real registry). Known ceiling: deleting a project that ever had images
    # pushed still 500s on purge (Faraday::ConnectionFailed talking to the
    # registry) if the registry pod is down/removed later — don't disable this
    # again without also cleaning up pushed images first, or just don't delete
    # projects with images.
    registry:
      enabled: true

    # ponytail: shared postgres + redis (helm/postgres, helm/redis). db + role
    # `gitlab`/`gitlabhq_production` on the shared postgres (initdb also creates
    # the pg_trgm / btree_gist extensions GitLab needs). Redis: GitLab keeps its
    # default logical DB 0 (all its components agree on it); authentik is moved
    # to DB 1 so the two apps don't share a keyspace.
    # gitlab-postgres-secret is created in terraform/gitlab.tf.
    psql:
      host: postgres.postgres.svc.cluster.local
      port: 5432
      database: gitlabhq_production
      username: gitlab
      password:
        secret: gitlab-postgres-secret
        key: password
    redis:
      host: redis.redis.svc.cluster.local
      port: 6379
      auth:
        enabled: false
    # ponytail: chart 10.x defaults to Gateway API (envoy-gateway subchart +
    # gatewayapi.io CRDs) instead of plain Ingress -> hard-fails with "no
    # matches for kind ... ensure CRDs are installed first" since this
    # cluster has neither. We stay on classic Traefik Ingress below.
    gatewayApi:
      enabled: false
      installEnvoy: false
    ingress:
      enabled: true
      # ponytail: helm template has no live cluster to auto-detect API
      # versions from; same class of issue as the pdb/hpa overrides above
      apiVersion: networking.k8s.io/v1
      provider: traefik
      class: traefik
      annotations:
        cert-manager.io/cluster-issuer: homelab-ca-issuer
      tls:
        enabled: true
        secretName: gitlab-tls
      # ponytail: defaults true independent of ingress.enabled, keeps
      # spawning a cert-manager issuer job; we manage our own ClusterIssuer
      configureCertmanager: false
    # ponytail: backed by the standalone minio app (helm/minio), not the
    # gitlab chart's own bundled minio subchart (global.minio stays
    # disabled below) — connection secret wired in terraform/internal/gitlab.tf.
    # Per-feature blocks below must leave `connection` empty and only set
    # `bucket` for the chart to treat object_store.connection as the
    # consolidated one they all inherit (see charts/gitlab/_objectStorage.tpl).
    appConfig:
      object_store:
        enabled: true
      lfs:
        enabled: true
        bucket: git-lfs
      artifacts:
        enabled: true
        bucket: gitlab-artifacts
      uploads:
        enabled: true
        bucket: gitlab-uploads
      packages:
        enabled: true
        bucket: gitlab-packages
      externalDiffs:
        enabled: true
        bucket: gitlab-mr-diffs
      dependencyProxy:
        enabled: true
        bucket: gitlab-dependency-proxy
      terraformState:
        enabled: true
        bucket: gitlab-terraform-state
      ciSecureFiles:
        enabled: true
        bucket: gitlab-ci-secure-files
      backups:
        bucket: gitlab-backups
    minio:
      enabled: false
    kas:
      enabled: false
    # ponytail: pin explicitly rather than rely on the chart's
    # Capabilities-based API auto-detection, which can fall back to the
    # long-removed policy/v1beta1 PDB kind depending on how/when it runs.
    pdb:
      apiVersion: policy/v1
    hpa:
      apiVersion: autoscaling/v2
    # ponytail: gitlab-shell's SSH IngressRouteTCP only renders once
    # ingress.provider is traefik; same auto-detection gap as above,
    # this cluster's Traefik (v3) only registers the newer traefik.io group
    traefik:
      apiVersion: traefik.io/v1alpha1

  registry:
    enabled: true
    # ponytail: chart 10.x dropped its bundled object-storage default for the
    # registry (was local filesystem PVC before) -> must point it at MinIO
    # explicitly or the chart hard-fails at render with "no object storage
    # solution". Secret (key: config) wired in terraform/internal/gitlab.tf,
    # same MinIO backend every other gitlab feature (artifacts/lfs/uploads)
    # already uses via appConfig.object_store above.
    storage:
      secret: gitlab-registry-storage
      key: config
  # ponytail: chart 9.x renamed certmanager.install -> top-level
  # installCertmanager. We run our own ClusterIssuer
  # (global.ingress.configureCertmanager: false above) — no bundled
  # cert-manager, no CRDs.
  installCertmanager: false
  certmanager:
    installCRDs: false
  nginx-ingress:
    enabled: false
  # ponytail: runner registers + clones over the in-cluster Service, not the
  # tailnet hostname — the job/runner pods aren't on the tailnet and
  # `tailscale serve` is tailnet-only, so the external URL is unreachable
  # from inside k3d.
  # GitLab 18 removed registration tokens: terraform/internal/gitlab.tf's
  # gitlab_runner_auth_token step mints a glrt- auth token post-deploy and
  # writes it into gitlab-gitlab-runner-secret (key: runner-token).
  gitlab-runner:
    install: true
    gitlabUrl: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/
    rbac:
      create: true
    runners:
      # ponytail: privileged so `docker:dind` service containers work. k3d
      # nodes already run privileged (k3s needs it), so this works on Docker
      # Desktop. Prefer kaniko for image builds where you can — dind is the
      # escape hatch for jobs that genuinely need the docker daemon.
      privileged: true
      # ponytail: distributed cache in MinIO so jobs on different runner pods
      # share cache/. Secret carries the S3 creds (keys: accesskey/secretkey).
      cache:
        secretName: gitlab-runner-cache-credentials
      config: |
        [[runners]]
          # ponytail: CI_REPOSITORY_URL is derived from GitLab's external URL,
          # which job pods can't reach — force in-cluster clones.
          clone_url = "http://gitlab-webservice-default.gitlab.svc.cluster.local:8181"
          [runners.cache]
            Type = "s3"
            Shared = true
            [runners.cache.s3]
              ServerAddress = "minio.minio.svc.cluster.local:9000"
              BucketName = "gitlab-runner-cache"
              BucketLocation = "us-east-1"
              Insecure = true
          [runners.kubernetes]
            namespace = "gitlab"
            image = "alpine:3.21"
            privileged = true
            cpu_request = "100m"
            memory_request = "256Mi"
            cpu_limit = "1"
            memory_limit = "2Gi"
            # ponytail: shared /certs/client between build + docker:dind service
            [[runners.kubernetes.volumes.empty_dir]]
              name = "docker-certs"
              mount_path = "/certs/client"
              medium = "Memory"
          [runners.kubernetes.pod_labels]
            app = "gitlab-ci-job"
  prometheus:
    install: false
  grafana:
    enabled: false
  gitlab:
    toolbox:
      enabled: false
    webservice:
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        # ponytail: 2Gi leaves no headroom for a second Rails boot, so
        # `rails runner` (gitlab-promote-admin) gets OOMKilled (exit 137) and
        # the Web IDE OAuth redirect_uri realign silently never runs. 3Gi
        # still wasn't enough (puma alone sits ~1.6Gi resident, a concurrent
        # rails runner exec pushed it over) — bumped to 4Gi. Node has room
        # (22Gi capacity, no MemoryPressure); bump back down if it doesn't.
        limits:
          memory: 4Gi
    sidekiq:
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 768Mi
        # ponytail: 1Gi OOMKilled sidekiq mid-job (exit 137) processing a
        # real CI pipeline event, leaving MergeRequests::UpdateHeadPipelineWorker
        # unfinished and MR merge_status stuck at "preparing" forever. 2Gi fits.
        limits:
          memory: 2Gi
    gitaly:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
    gitlab-shell:
      minReplicas: 1
      maxReplicas: 1

  # ponytail: bundled bitnami postgresql + redis subcharts off — GitLab uses the
  # shared postgres / redis (global.psql / global.redis above).
  postgresql:
    install: false
  redis:
    install: false
