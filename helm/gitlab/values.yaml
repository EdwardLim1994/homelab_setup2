gitlab:
  global:
    edition: ce
    hosts:
      domain: gitlab.local
      # ponytail: without this, hostname defaults to "gitlab.<domain>" i.e.
      # gitlab.gitlab.local (domain already includes "gitlab")
      gitlab:
        name: gitlab.local
    initialRootPassword:
      secret: ""  # set via terraform

    # ponytail: the top-level `registry:` component toggle (below, outside
    # global) only skips deploying the registry pod — gitlab.yml still
    # renders registry.enabled: true pointing at
    # gitlab-registry.gitlab.svc:5000 unless global.registry is also told, so
    # any project with container_registry_access_level enabled (the default)
    # fails HARD on *deletion*: GitLab checks the registry for image tags to
    # purge, DNS lookup for the nonexistent service fails
    # (Faraday::ConnectionFailed), and the whole delete 500s with no UI error.
    registry:
      enabled: false

    # ponytail: shared postgres + redis (helm/postgres, helm/redis). db + role
    # `gitlab`/`gitlabhq_production` on the shared postgres (initdb also creates
    # the pg_trgm / btree_gist extensions GitLab needs). Redis: GitLab keeps its
    # default logical DB 0 (all its components agree on it); authentik is moved
    # to DB 1 so the two apps don't share a keyspace.
    # gitlab-postgres-secret is created in terraform/gitlab.tf.
    psql:
      host: postgres.postgres.svc.cluster.local
      port: 5432
      database: gitlabhq_production
      username: gitlab
      password:
        secret: gitlab-postgres-secret
        key: password
    redis:
      host: redis.redis.svc.cluster.local
      port: 6379
      auth:
        enabled: false
    ingress:
      enabled: true
      # ponytail: helm template has no live cluster to auto-detect API
      # versions from; same class of issue as the pdb/hpa overrides above
      apiVersion: networking.k8s.io/v1
      provider: traefik
      class: traefik
      annotations:
        cert-manager.io/cluster-issuer: homelab-ca-issuer
      tls:
        enabled: true
        secretName: gitlab-tls
      # ponytail: defaults true independent of ingress.enabled, keeps
      # spawning a cert-manager issuer job; we manage our own ClusterIssuer
      configureCertmanager: false
    # ponytail: backed by the standalone minio app (helm/minio), not the
    # gitlab chart's own bundled minio subchart (global.minio stays
    # disabled below) — connection secret wired in gitlab/Tiltfile.
    # Per-feature blocks below must leave `connection` empty and only set
    # `bucket` for the chart to treat object_store.connection as the
    # consolidated one they all inherit (see charts/gitlab/_objectStorage.tpl).
    appConfig:
      object_store:
        enabled: true
      lfs:
        enabled: true
        bucket: git-lfs
      artifacts:
        enabled: true
        bucket: gitlab-artifacts
      uploads:
        enabled: true
        bucket: gitlab-uploads
      packages:
        enabled: true
        bucket: gitlab-packages
      externalDiffs:
        enabled: true
        bucket: gitlab-mr-diffs
      dependencyProxy:
        enabled: true
        bucket: gitlab-dependency-proxy
      terraformState:
        enabled: true
        bucket: gitlab-terraform-state
      ciSecureFiles:
        enabled: true
        bucket: gitlab-ci-secure-files
      backups:
        bucket: gitlab-backups
    minio:
      enabled: false
    kas:
      enabled: false
    # ponytail: Tilt's helm() runs `helm template` with no cluster connection,
    # so Capabilities-based API auto-detection can't run and falls back to the
    # long-removed policy/v1beta1 PDB kind. Pin explicitly.
    pdb:
      apiVersion: policy/v1
    hpa:
      apiVersion: autoscaling/v2
    # ponytail: gitlab-shell's SSH IngressRouteTCP only renders once
    # ingress.provider is traefik; same live-cluster-detection gap as above,
    # this cluster's Traefik (v3) only registers the newer traefik.io group
    traefik:
      apiVersion: traefik.io/v1alpha1

  # disable non-essential components
  registry:
    enabled: false
  # ponytail: chart 9.x renamed certmanager.install -> top-level
  # installCertmanager. We run our own ClusterIssuer
  # (global.ingress.configureCertmanager: false above) — no bundled
  # cert-manager, no CRDs.
  installCertmanager: false
  certmanager:
    installCRDs: false
  nginx-ingress:
    enabled: false
  # ponytail: runner registers + clones over the in-cluster Service, not the
  # tailnet hostname — the job/runner pods aren't on the tailnet and
  # `tailscale serve` is tailnet-only, so the external URL is unreachable
  # from inside k3d.
  # GitLab 18 removed registration tokens: the Tiltfile's
  # gitlab-runner-auth-token step mints a glrt- auth token post-deploy and
  # writes it into gitlab-gitlab-runner-secret (key: runner-token).
  gitlab-runner:
    install: true
    gitlabUrl: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/
    rbac:
      create: true
    runners:
      # ponytail: privileged so `docker:dind` service containers work. k3d
      # nodes already run privileged (k3s needs it), so this works on Docker
      # Desktop. Prefer kaniko for image builds where you can — dind is the
      # escape hatch for jobs that genuinely need the docker daemon.
      privileged: true
      # ponytail: distributed cache in MinIO so jobs on different runner pods
      # share cache/. Secret carries the S3 creds (keys: accesskey/secretkey).
      cache:
        secretName: gitlab-runner-cache-credentials
      config: |
        [[runners]]
          # ponytail: CI_REPOSITORY_URL is derived from GitLab's external URL,
          # which job pods can't reach — force in-cluster clones.
          clone_url = "http://gitlab-webservice-default.gitlab.svc.cluster.local:8181"
          [runners.cache]
            Type = "s3"
            Shared = true
            [runners.cache.s3]
              ServerAddress = "minio.minio.svc.cluster.local:9000"
              BucketName = "gitlab-runner-cache"
              BucketLocation = "us-east-1"
              Insecure = true
          [runners.kubernetes]
            namespace = "gitlab"
            image = "alpine:3.21"
            privileged = true
            cpu_request = "100m"
            memory_request = "256Mi"
            cpu_limit = "1"
            memory_limit = "2Gi"
            # ponytail: shared /certs/client between build + docker:dind service
            [[runners.kubernetes.volumes.empty_dir]]
              name = "docker-certs"
              mount_path = "/certs/client"
              medium = "Memory"
          [runners.kubernetes.pod_labels]
            app = "gitlab-ci-job"
  prometheus:
    install: false
  grafana:
    enabled: false
  gitlab:
    toolbox:
      enabled: false
    webservice:
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        # ponytail: 2Gi leaves no headroom for a second Rails boot, so
        # `rails runner` (gitlab-promote-admin) gets OOMKilled (exit 137) and
        # the Web IDE OAuth redirect_uri realign silently never runs. 3Gi fits
        # puma + one runner. Node has room; bump back down if it doesn't.
        limits:
          memory: 3Gi
    sidekiq:
      minReplicas: 1
      maxReplicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 1Gi
    gitaly:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
    gitlab-shell:
      minReplicas: 1
      maxReplicas: 1

  # ponytail: bundled bitnami postgresql + redis subcharts off — GitLab uses the
  # shared postgres / redis (global.psql / global.redis above).
  postgresql:
    install: false
  redis:
    install: false
