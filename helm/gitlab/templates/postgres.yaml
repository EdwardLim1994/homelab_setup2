# ponytail: plain postgres:16 for GitLab — the gitlab chart's bundled postgresql
# is bitnami (free images gone). GitLab officially supports external psql
# (global.psql in values.yaml). initdb creates the extensions GitLab's migrations
# expect (pg_trgm, btree_gist); on the official image initdb SQL runs as the
# bootstrap superuser so CREATE EXTENSION always works.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-postgres-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  password: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-postgres-initdb
  namespace: {{ .Release.Namespace }}
data:
  10-extensions.sql: |
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    CREATE EXTENSION IF NOT EXISTS btree_gist;
    CREATE EXTENSION IF NOT EXISTS plpgsql;
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: gitlab-postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitlab-postgres
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: gitlab-postgres
  replicas: 1
  selector:
    matchLabels:
      app: gitlab-postgres
  template:
    metadata:
      labels:
        app: gitlab-postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image }}"
          # ponytail: GitLab's structure.sql loads the whole schema (thousands of
          # partitioned tables) in one transaction — the default
          # max_locks_per_transaction=64 blows the shared lock table
          # ("ERROR: out of shared memory" at db:schema:load). 512 clears GitLab
          # 18's schema with headroom; raise if a future schema grows past it.
          args: ["-c", "max_locks_per_transaction=512"]
          env:
            - name: POSTGRES_DB
              value: gitlabhq_production
            - name: POSTGRES_USER
              value: gitlab
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gitlab", "-d", "gitlabhq_production"]
            initialDelaySeconds: 15
            periodSeconds: 10
          # ponytail: startupProbe holds liveness off through slow crash recovery
          # on local-path storage (see the old bitnami-subchart comment history).
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "gitlab", "-d", "gitlabhq_production"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 60
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: initdb
          configMap:
            name: gitlab-postgres-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storageSize | quote }}
