# ponytail: plain redis:7-alpine, no auth (cluster-internal) — replaces the
# gitlab chart's bundled bitnami redis. GitLab uses redis as cache / queues /
# sessions, not durable storage, so no PVC (appendonly off).
apiVersion: v1
kind: Service
metadata:
  name: gitlab-redis
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: gitlab-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-redis
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab-redis
  template:
    metadata:
      labels:
        app: gitlab-redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image }}"
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
