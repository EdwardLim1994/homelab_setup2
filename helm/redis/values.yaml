# ponytail: one shared redis:7-alpine. No PVC (--save "" --appendonly no) —
# authentik and gitlab both use redis as cache/broker/sessions, not a
# datastore. No auth (cluster-internal). Consumers pick a logical DB:
#   gitlab    -> DB 0   (its default; all components agree)
#   authentik -> DB 1   (AUTHENTIK_REDIS__DB)
#   harbor    -> DB 2   (helm/harbor/values.yaml's redis.external.db)
# argocd keeps its own bundled redis (tightly coupled to the argo-cd chart).
image: redis:7-alpine

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi
