# ponytail: same image+settings as taiga-back, different entrypoint (the
# async task worker) — no separate ConfigMap, reuses -back-env/-back-settings.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-async
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-async
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-async
      annotations:
        checksum/settings: {{ include (print $.Template.BasePath "/back-settings-configmap.yaml") . | sha256sum }}
        checksum/env: {{ printf "%s%s%s" (toYaml .Values.postgresql) (toYaml .Values.taiga) (toYaml .Values.rabbitmq) | sha256sum }}
    spec:
      initContainers:
        # ponytail: same read-only-configmap chown issue as taiga-back (see
        # templates/back.yaml) — copy settings into a writable emptyDir first.
        - name: copy-settings
          image: busybox:1.36
          command: ["sh", "-c", "cp /configmap-settings/local.py /configmap-settings/urls.py /writable-settings/"]
          volumeMounts:
            - name: settings
              mountPath: /configmap-settings
            - name: settings-writable
              mountPath: /writable-settings
        - name: wait-for-back
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ .Release.Name }}-back 8000; do sleep 2; done"]
      containers:
        - name: taiga-async
          image: {{ .Values.image.backOidc }}
          command: ["/taiga-back/docker/async_entrypoint.sh"]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-back-env
          volumeMounts:
            - name: settings-writable
              mountPath: /taiga-back/settings/local.py
              subPath: local.py
            - name: settings-writable
              mountPath: /taiga-back/settings/urls.py
              subPath: urls.py
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: settings
          configMap:
            name: {{ .Release.Name }}-back-settings
        - name: settings-writable
          emptyDir: {}
