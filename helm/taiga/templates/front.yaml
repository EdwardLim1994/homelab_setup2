# ponytail: the OIDC login button needs taiga-contrib-oidc-auth's separate
# front/ plugin bundle copied into dist/plugins/oidc-auth (see
# ../Dockerfile.front) — conf.json's oidcMountPoint alone only targets an
# already-visible button at the right URL, it doesn't create the button.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-front-conf
  namespace: {{ .Release.Namespace }}
data:
  conf.json: |
    {
      "api": "{{ .Values.taiga.siteScheme }}://{{ .Values.taiga.siteDomain }}/api/v1/",
      "eventsUrl": "wss://{{ .Values.taiga.siteDomain }}/events",
      "oidcMountPoint": "/oidc",
      "debug": false,
      "defaultLanguage": "en",
      "themes": ["taiga"],
      "defaultTheme": "taiga",
      "publicRegisterEnabled": false,
      "feedbackEnabled": false,
      "supportUrl": "https://tree.taiga.io/support",
      "maxUploadFileSize": null,
      "contribPlugins": ["/plugins/oidc-auth/oidc-auth.json"],
      "oidcButtonText": "Authentik"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-front
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-front
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-front
    spec:
      containers:
        - name: taiga-front
          image: {{ .Values.image.front }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /usr/share/nginx/html/conf.json
              subPath: conf.json
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: conf
          configMap:
            name: {{ .Release.Name }}-front-conf
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-front
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-front
  ports:
    - port: 80
      targetPort: 80
