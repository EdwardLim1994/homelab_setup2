# ponytail: reverse-proxies front+back+events+protected behind one
# Service:port — same role harbor's/openproject's unified Service played for
# this repo's one-Service-per-Ingress convention. Routing mirrors
# taiga-docker's own taiga-gateway/taiga.conf.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-gateway-conf
  namespace: {{ .Release.Namespace }}
data:
  taiga.conf: |
    server {
      listen 80 default_server;
      client_max_body_size 100M;
      charset utf-8;

      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # ponytail: $scheme here is this gateway's own inbound connection
      # (plain HTTP — TLS is terminated upstream by tailscale/traefik, both
      # HTTPS-only for this app), not the browser's real scheme. Hardcode
      # https so taiga-back's SECURE_PROXY_SSL_HEADER check (and the OIDC
      # redirect_uri it builds) sees the real scheme instead of http.
      proxy_set_header X-Forwarded-Proto "https";

      location /api/ {
        proxy_pass http://{{ .Release.Name }}-back:8000/api/;
      }
      location /admin/ {
        proxy_pass http://{{ .Release.Name }}-back:8000/admin/;
      }
      location /oidc/ {
        proxy_pass http://{{ .Release.Name }}-back:8000/oidc/;
      }
      location /static/ {
        alias /taiga-back/static/;
      }
      location /media/exports/ {
        alias /taiga-back/media/exports/;
      }
      location /media/ {
        proxy_pass http://{{ .Release.Name }}-protected:8003/;
      }
      location /events {
        proxy_pass http://{{ .Release.Name }}-events:8888/events;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 604800;
      }
      location / {
        proxy_pass http://{{ .Release.Name }}-front:80/;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-gateway
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-gateway
      annotations:
        # ponytail: can't self-include this same file for a checksum (infinite
        # recursion) — bump this literal on every nginx conf edit instead.
        checksum/conf: "v2-https-forwarded-proto"
    spec:
      containers:
        - name: gateway
          image: {{ .Values.image.gateway }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: taiga.conf
            - name: static-media
              mountPath: /taiga-back/static
              subPath: static
              readOnly: true
            - name: static-media
              mountPath: /taiga-back/media
              subPath: media
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: conf
          configMap:
            name: {{ .Release.Name }}-gateway-conf
        - name: static-media
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-static-media
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-gateway
  ports:
    - port: 80
      targetPort: 80
