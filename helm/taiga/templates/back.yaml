apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-back
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-back
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-back
      annotations:
        checksum/settings: {{ include (print $.Template.BasePath "/back-settings-configmap.yaml") . | sha256sum }}
        checksum/env: {{ printf "%s%s%s" (toYaml .Values.postgresql) (toYaml .Values.taiga) (toYaml .Values.rabbitmq) | sha256sum }}
    spec:
      initContainers:
        # ponytail: base taigaio/taiga-back entrypoint chowns settings/*.py on
        # every start — configMap mounts are always read-only (even with
        # subPath), so that chown fails and crashes the container. Copy the
        # configmap content into a writable emptyDir first; only local.py/
        # urls.py get overridden here, subPath keeps the image's other
        # settings files untouched for every other container.
        - name: copy-settings
          image: busybox:1.36
          command: ["sh", "-c", "cp /configmap-settings/local.py /configmap-settings/urls.py /writable-settings/"]
          volumeMounts:
            - name: settings
              mountPath: /configmap-settings
            - name: settings-writable
              mountPath: /writable-settings
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z {{ .Values.postgresql.host }} {{ .Values.postgresql.port }}; do sleep 2; done"]
        # ponytail: migrate/collectstatic are safe to re-run on every pod
        # start (idempotent) — simpler than a separate one-shot seeder Job
        # (OpenProject's chart used one; not worth the extra resource here
        # for a single-replica app). Admin bootstrap checks existence first.
        - name: migrate-and-bootstrap
          image: {{ .Values.image.backOidc }}
          command:
            - sh
            - -c
            - |
              python manage.py migrate --noinput &&
              python manage.py collectstatic --noinput &&
              python manage.py shell -c "
              from django.contrib.auth import get_user_model
              User = get_user_model()
              if not User.objects.filter(username='admin').exists():
                  User.objects.create_superuser('admin', '{{ .Values.taiga.adminEmail }}', '{{ .Values.taiga.adminPassword }}')
              "
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-back-env
          volumeMounts:
            - name: settings-writable
              mountPath: /taiga-back/settings/local.py
              subPath: local.py
            - name: settings-writable
              mountPath: /taiga-back/settings/urls.py
              subPath: urls.py
            - name: static-media
              mountPath: /taiga-back/static
              subPath: static
            - name: static-media
              mountPath: /taiga-back/media
              subPath: media
      containers:
        - name: taiga-back
          image: {{ .Values.image.backOidc }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-back-env
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: settings-writable
              mountPath: /taiga-back/settings/local.py
              subPath: local.py
            - name: settings-writable
              mountPath: /taiga-back/settings/urls.py
              subPath: urls.py
            - name: static-media
              mountPath: /taiga-back/static
              subPath: static
            - name: static-media
              mountPath: /taiga-back/media
              subPath: media
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: settings
          configMap:
            name: {{ .Release.Name }}-back-settings
        - name: settings-writable
          emptyDir: {}
        - name: static-media
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-static-media
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-back-env
  namespace: {{ .Release.Namespace }}
data:
  # ponytail: the base image's own entrypoint/gunicorn always run with
  # DJANGO_SETTINGS_MODULE=settings.config baked into the image — our
  # settings/local.py (OIDC config, ROOT_URLCONF override) never loaded
  # without this override, even though it was mounted and correct.
  DJANGO_SETTINGS_MODULE: "settings.local"
  POSTGRES_DB: {{ .Values.postgresql.database | quote }}
  POSTGRES_HOST: {{ .Values.postgresql.host | quote }}
  POSTGRES_USER: {{ .Values.postgresql.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  TAIGA_SECRET_KEY: {{ .Values.taiga.secretKey | quote }}
  TAIGA_SITES_SCHEME: {{ .Values.taiga.siteScheme | quote }}
  TAIGA_SITES_DOMAIN: {{ .Values.taiga.siteDomain | quote }}
  RABBITMQ_USER: {{ .Values.rabbitmq.user | quote }}
  RABBITMQ_PASS: {{ .Values.rabbitmq.password | quote }}
  # config.py defaults these to taiga-async-rabbitmq/taiga-events-rabbitmq
  # (taiga-docker's two-instance split) — this chart runs one consolidated
  # rabbitmq, named {{ .Release.Name }}-rabbitmq.
  TAIGA_ASYNC_RABBITMQ_HOST: "{{ .Release.Name }}-rabbitmq"
  TAIGA_EVENTS_RABBITMQ_HOST: "{{ .Release.Name }}-rabbitmq"
  ENABLE_TELEMETRY: "False"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-back
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-back
  ports:
    - port: 8000
      targetPort: 8000
