apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-events
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-events
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-events
    spec:
      containers:
        - name: taiga-events
          image: {{ .Values.image.events }}
          env:
            - name: RABBITMQ_USER
              value: {{ .Values.rabbitmq.user | quote }}
            - name: RABBITMQ_PASS
              value: {{ .Values.rabbitmq.password | quote }}
            - name: RABBITMQ_VHOST
              value: {{ .Values.rabbitmq.vhost | quote }}
            - name: TAIGA_SECRET_KEY
              value: {{ .Values.taiga.secretKey | quote }}
          ports:
            - containerPort: 8888
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-events
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-events
  ports:
    - port: 8888
      targetPort: 8888
