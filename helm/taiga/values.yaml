# ponytail: shared postgres (helm/postgres) for taiga-db — not a bundled one,
# same convention as every other internal-cluster app. rabbitmq is this
# chart's own (first message-broker chart in this repo — no shared instance
# to reuse, taiga-async and taiga-events are the only two consumers).
# No chart-owned Ingress: tailscale + .local ingresses are plain
# kubectl_manifest resources in terraform/internal/taiga.tf, same as harbor.

image:
  # custom-built (see ../Dockerfile) — official taiga-back + the OIDC plugin.
  # Built+pushed by terraform/internal/taiga.tf before the helm_release runs.
  # k3d-registry:5111 — the in-cluster DNS name k3d wires up for pods (same
  # registry the build pushes to via localhost:5111, host-side only; see
  # helm/omp-agent/values.yaml for the identical pattern).
  backOidc: "k3d-registry:5111/taiga-back-oidc:dev"
  # custom-built (see ../Dockerfile.front) — official taiga-front plus the
  # oidc-auth plugin bundle that renders the login button.
  front: "k3d-registry:5111/taiga-front-oidc:dev"
  events: "taigaio/taiga-events:latest"
  protected: "taigaio/taiga-protected:latest"
  gateway: "nginx:1.27-alpine"
  rabbitmq: "rabbitmq:3.8-management-alpine"

postgresql:
  host: "postgres.postgres.svc.cluster.local"
  port: 5432
  user: "taiga"
  database: "taiga"
  password: "__SHARED_DB_PASSWORD__"

rabbitmq:
  user: "taiga"
  # ponytail: taiga-back's own settings/config.py hardcodes its
  # CELERY_BROKER_URL/EVENTS_PUSH_BACKEND_URL defaults as
  # amqp://user:pass@host:5672/taiga -- that URL path segment IS the vhost
  # name, with no leading slash. Setting this to "/taiga" creates a vhost
  # literally named "/taiga", which taiga-back can't connect to
  # (amqp.exceptions.NotAllowed: vhost taiga not found) -- breaks every
  # celery-driven action (project delete, GitLab webhook delivery, etc).
  # Must match taiga-back's hardcoded default exactly: no leading slash.
  vhost: "taiga"
  password: "__TAIGA_RABBITMQ_PASSWORD__"
  # ponytail: erlang cookie only matters for multi-node rabbitmq clustering —
  # single replica here, but the image still requires one to be set.
  erlangCookie: "__TAIGA_RABBITMQ_PASSWORD__"

taiga:
  secretKey: "__TAIGA_SECRET_KEY__"
  siteScheme: "https"
  siteDomain: "__APP_URL_HOST__"
  adminPassword: "__TAIGA_ADMIN_PASSWORD__"
  adminEmail: "__ADMIN_EMAIL__"

  # ConfigMap-mounted settings/local.py + settings/urls.py (see
  # templates/back.yaml) — the official image supports overriding both by
  # volume mount, no image rebuild needed for config, only for the pip
  # package itself (see ../Dockerfile).
  oidc:
    baseUrl: "__AUTHENTIK_URL__/application/o/authorize"
    authorizationEndpoint: "__AUTHENTIK_URL__/application/o/authorize/"
    tokenEndpoint: "http://authentik-server.authentik.svc.cluster.local/application/o/token/"
    userInfoEndpoint: "http://authentik-server.authentik.svc.cluster.local/application/o/userinfo/"
    jwksEndpoint: "http://authentik-server.authentik.svc.cluster.local/application/o/taiga/jwks/"
    clientId: "__TAIGA_OIDC_CLIENT_ID__"
    clientSecret: "__TAIGA_OIDC_CLIENT_SECRET__"

ingress:
  enabled: false

persistence:
  # single k3d node — ReadWriteOnce is fine (same reasoning as
  # helm/openproject's old accessModes override: local-path only provisions
  # RWO, and every pod needing this volume is scheduled on the same node
  # anyway). Shared between taiga-back (writes static/media), taiga-gateway
  # (serves /static + /media/exports directly off disk, per taiga-docker's
  # own nginx conf), and taiga-protected (serves attachment downloads).
  storageSize: 10Gi

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi
