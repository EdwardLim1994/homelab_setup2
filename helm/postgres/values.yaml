# ponytail: one shared postgres:16 for every homelab app that needs Postgres.
# The initdb script creates a LOGIN role + owned database per entry in
# `databases` below, all with the same password (`appPassword`) — a homelab
# doesn't need per-app credential isolation, and one secret is one thing to
# rotate. nextcloud stays on its own MariaDB (different engine); argocd keeps
# its bundled redis.
image: postgres:16

# superuser + every app role share this. Set via terraform (var.shared_db_password).
password: ""

# One database (== role name) per app. `gitlabhq_production` also gets the
# pg_trgm / btree_gist extensions GitLab's migrations expect (created here by
# the bootstrap superuser, so a non-superuser app role never needs to).
databases:
  - authentik
  - litellm
  - n8n
  - sonarqube
  - harbor
  - kaneo
gitlabDatabase: gitlabhq_production

storageSize: 20Gi

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

# ponytail: pg_dumpall (superuser, dumps every role + every app database in
# one file — simpler than one dump per app) piped to minio via `mc`. No
# retention/pruning automation — the bucket just grows; delete old dumps by
# hand or add an `mc ilm` expiry rule if disk becomes a problem.
backup:
  enabled: true
  schedule: "0 18 * * *"  # 18:00 UTC daily
  bucket: postgres-backups
  minioEndpoint: http://minio.minio.svc.cluster.local:9000
  minioRootUser: admin
  minioRootPassword: ""  # set via terraform variable
