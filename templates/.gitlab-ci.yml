# CI/CD for the nx-project-template workspace.
# Stages: test -> build -> publish.
#
# publish pushes every built package under dist/tools/* to this project's
# GitLab Package Registry (npm). Auth is the automatic CI_JOB_TOKEN -- no PAT,
# no CI/CD variable to configure. It runs on git tags only; the tag name is
# the published version (tag `v1.2.3` -> package version must be `1.2.3`).
#
# Install the published package elsewhere with a group-level .npmrc:
#   @edwardlim1994:registry=${CI_SERVER_URL}/api/v4/groups/<group-id>/-/packages/npm/

stages:
  - test
  - build
  - publish

variables:
  BUN_VERSION: "1.4.0"
  NX_DAEMON: "false"

default:
  image: node:20-slim
  cache:
    key:
      files:
        - bun.lock
    paths:
      - node_modules/
      - .nx/cache/
  before_script:
    - npm install -g "bun@${BUN_VERSION}"
    - bun install --frozen-lockfile

test:
  stage: test
  script:
    - bunx biome ci .
    - bunx nx run-many -t test --parallel=3

build:
  stage: build
  script:
    - bunx nx run-many -t build --parallel=3
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

publish:
  stage: publish
  needs: ["build"]
  rules:
    - if: $CI_COMMIT_TAG
  before_script: []          # skip bun install; publishing only needs npm + dist/
  script:
    - |
      set -e
      registry="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
      auth_host="//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"
      published=0
      for pkg in dist/tools/*/; do
        [ -f "${pkg}package.json" ] || continue
        name=$(node -p "require('./${pkg}package.json').name")
        case "$name" in
          @*) ;;
          *) echo "skip ${pkg}: name '${name}' is not scoped"; continue ;;
        esac
        echo "publishing ${name} from ${pkg}"
        ( cd "$pkg"
          npm pkg delete private
          {
            echo "${name%%/*}:registry=${registry}"
            echo "${auth_host}:_authToken=${CI_JOB_TOKEN}"
          } > .npmrc
          npm publish
        )
        published=$((published+1))
      done
      [ "$published" -gt 0 ] || { echo "nothing published"; exit 1; }
