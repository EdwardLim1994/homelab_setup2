apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  serviceName: kafka
  replicas: {{ .Values.replicaCounts }} 
  selector:
    matchLabels:
      {{- include "kafka.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kafka.labels" . | nindent 8 }}
    spec:
      # Kubernetes auto-injects <SVC>_PORT env vars into every pod in this namespace; disabling
      # Service env var injection avoids relying on none of those ever colliding with something
      # Kafka's entrypoint reads, for no functional loss (nothing here reads KAFKA_PORT or any
      # other auto-injected var).
      enableServiceLinks: false
      # No use of the Kubernetes API from within this pod.
      automountServiceAccountToken: false
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image }}"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 256Mi
            # 512Mi was right at the JVM's working-set ceiling under host memory pressure — the
            # exec probe's own subprocess (kafka-broker-api-versions, a second JVM) would GC-stall
            # past its 30s timeout and get kicked into a restart loop. 1Gi gives headroom for both.
            limits:
              memory: 1Gi
              ephemeral-storage: 512Mi
          ports:
            - name: plaintext
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: {{ .Values.kafka.nodeId | quote }}
            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}
            # Single PLAINTEXT listener, advertised as this Service's cluster-wide FQDN — unlike
            # the docker-compose version's three listeners (PLAINTEXT/PLAINTEXT_HOST/
            # PLAINTEXT_MINIKUBE), there's no pod<->host network boundary to cross here: any pod,
            # in any namespace, resolves kafka.{{ .Values.namespace }}.svc.cluster.local and
            # reconnects to it correctly once Kafka's protocol redirects it there post-bootstrap
            # (see services/kafka/docker-compose.yml's PLAINTEXT_MINIKUBE comment for the class of
            # bug this sidesteps).
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.{{ .Values.namespace }}.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LOG_DIRS
              value: "/tmp/kraft-combined-logs"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka.{{ .Values.namespace }}.svc.cluster.local:9093"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
          # Same first-boot storage-format dance as services/kafka/docker-compose.yml's command:
          # KRaft needs `kafka-storage format` run once against the (persistent) log dir before
          # the broker process itself starts.
          command:
            - bash
            - -c
            - |
              if [ ! -f /tmp/kraft-combined-logs/meta.properties ]; then
                echo 'Formatting storage directory...'
                kafka-storage format \
                  --ignore-formatted \
                  --cluster-id="$CLUSTER_ID" \
                  --config /etc/kafka/kafka.properties
              fi
              /etc/confluent/docker/run
          # startupProbe, not just a longer initialDelaySeconds on the other two — first boot
          # under CPU contention (e.g. other heavy docker builds running on the same small node)
          # has been observed taking minutes, not seconds; readiness/liveness's own
          # initialDelaySeconds only gets one fixed grace window before the *first* check, and
          # every restart re-enters that same too-short window, producing a permanent restart
          # loop that never reaches Ready. A startupProbe instead retries on its own schedule
          # until the broker answers once, and only then hands off to liveness/readiness.
          # ponytail: fixed knob, not per-node — tune per cluster if this still flaps.
          startupProbe:
            exec:
              command: ["kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
            periodSeconds: 20
            timeoutSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /tmp/kraft-combined-logs
        # Sidecar, not a separate Deployment — same reasoning as server1-infra's
        # postgres-exporter/redis-exporter: talks to Kafka over localhost, scraped by Prometheus
        # via this StatefulSet's Service on the "metrics" port below. Talks Kafka's own wire
        # protocol (no JMX agent to wire into the broker JVM).
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.7.0
          args:
            - --kafka.server=localhost:9092
          ports:
            - name: metrics
              containerPort: 9308
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.kafka.persistence.size }}
