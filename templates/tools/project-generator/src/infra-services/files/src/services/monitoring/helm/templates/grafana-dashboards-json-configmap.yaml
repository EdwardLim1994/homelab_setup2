apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-json
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
data:
  # Landing page — one tile per Deployment/StatefulSet in the "infra" namespace only
  # (services/*), driven by kube-state-metrics so new services show up with no dashboard edit.
  # apps/servers/* deliberately lives in its own Servers Infra Overview dashboard below instead
  # — kept separate so the two domains (services/* vs apps/servers/*) don't mix into one grid.
  # Click a tile, land on k8s-workload-detail.json filtered to that service.
  services-overview.json: |
{{ .Files.Get "files/grafana-dashboard-services-overview.json" | indent 4 }}
  # Generic per-service detail page — templated by $namespace/$app (set via either overview
  # grid's data links, or by hand in the dropdown), not one dashboard per service. Same file
  # serves every current and future Deployment/StatefulSet, in any namespace.
  k8s-workload-detail.json: |
{{ .Files.Get "files/grafana-dashboard-k8s-workload-detail.json" | indent 4 }}
  # Same grid pattern as services-overview.json, scoped to the server-apps namespace (the
  # apps/servers/* app Deployments themselves). Kept separate from Servers Infra Overview below
  # on purpose: app tier and infra tier don't mix into one grid.
  servers-app-overview.json: |
{{ .Files.Get "files/grafana-dashboard-servers-app-overview.json" | indent 4 }}
  # Same grid pattern, scoped to the server-infra namespace (Postgres/Redis/Debezium for every
  # apps/servers/*-infra chart) — Terraform-applied separately via apps/terraform and routinely
  # lags or is skipped in a given dev cluster.
  servers-infra-overview.json: |
{{ .Files.Get "files/grafana-dashboard-servers-infra-overview.json" | indent 4 }}
