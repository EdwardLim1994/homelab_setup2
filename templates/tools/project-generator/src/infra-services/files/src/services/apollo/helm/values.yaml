# Dependency alias "router" — values below follow the official chart's own schema
# (https://github.com/apollographql/router/blob/main/helm/chart/router/values.yaml).
# Release name (set by terraform's helm_release) stays "apollo-router";
# fullnameOverride keeps generated resource names matching that instead of "<release>-router".
router:
  fullnameOverride: apollo-router

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 128Mi
    limits:
      memory: 256Mi

  # The upstream chart's supergraph-cm.yaml only creates the ConfigMap from router.supergraphFile
  # below — it never mounts it or points the router at it (no volumeMount/--supergraph flag
  # wired anywhere in its deployment.yaml). Doing that ourselves here; configMap name below must
  # match "<router.fullname>-supergraph", i.e. this file's own fullnameOverride + "-supergraph".
  extraVolumes:
    - name: supergraph
      configMap:
        name: apollo-router-supergraph
  extraVolumeMounts:
    - name: supergraph
      mountPath: /etc/router/supergraph
      readOnly: true

  router:
    args:
      - --hot-reload
      - --supergraph
      - /etc/router/supergraph/supergraph-schema.graphql

    configuration:
      supergraph:
        listen: 0.0.0.0:4000
        path: /graphql
        introspection: true

      cors:
        policies:
          # Local dev frontends: frontend1's own dev server (3001) and portal (3000),
          # which loads frontend1 as a Module Federation remote.
          - origins:
              - http://localhost:3000
              - http://localhost:3001
            allow_headers:
              - content-type
            methods:
              - GET
              - POST
              - OPTIONS
          # Router default — Apollo Sandbox UI (enabled via `sandbox.enabled` above)
          # queries this router directly from studio.apollographql.com.
          - origins:
              - https://studio.apollographql.com

      sandbox:
        enabled: true

      homepage:
        enabled: false

      include_subgraph_errors:
        all: true

      # Native Prometheus exporter — the chart wires the container port, the Service's "metrics"
      # port, and prometheus.io/scrape pod annotations automatically once this is enabled (see
      # its templates/service.yaml and deployment.yaml), no extra chart/template work needed.
      telemetry:
        exporters:
          metrics:
            prometheus:
              enabled: true
              listen: 0.0.0.0:9090
              path: /metrics

  # router.supergraphFile itself lives in ./values.supergraph.yaml, layered on top of this file
  # (see terraform's helm_release.values) — generated by
  # `bun run supergraph` (packages/script/src/bin/compose-supergraph.ts), committed like a
  # lockfile so it doesn't need regenerating on every checkout. The chart mounts it as a
  # ConfigMap-backed file and the router hot-reloads on change, no redeploy/restart needed
  # beyond `helm upgrade` picking up the new ConfigMap content.

  # Same Host() this stack uses in docker-compose (services/apollo/docker-compose.yml's
  # `traefik.http.routers.apollo-router.rule` label) — kept identical across both environments
  # so nothing consuming this address needs an environment-specific override.
  ingress:
    enabled: true
    className: traefik
    hosts:
      - host: graphql.localhost
        paths:
          - path: /
            pathType: Prefix
