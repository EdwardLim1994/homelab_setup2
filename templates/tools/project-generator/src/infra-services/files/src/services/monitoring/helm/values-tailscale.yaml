# Layered on top of values.yaml (see services/terraform/main.tf) for local dev when Grafana is
# reached through scripts/port-forward.sh from another device, not the LAN — "authentik.lan"
# (values.yaml's default authUrl) isn't reachable from off-LAN, only from a browser that already
# has LAN access, so the browser-facing login redirect needs to point at the tailscale tunnel
# scripts/port-forward.sh already opens for authentik-server instead.
#
# Tradeoff, accepted: this makes Grafana's login always redirect through the tailscale hostname,
# even for LAN-direct access (https://grafana.lan:8443) — GF_AUTH_GENERIC_OAUTH_AUTH_URL is one
# static value, Grafana can't pick a different one per how the browser arrived. Fine as long as
# every client hitting Grafana is also tailnet-joined (true for this setup); if that stops being
# true, split the difference by *not* applying this file for LAN-only sessions.
#
# rootUrl's port (8085) and authUrl's host:port (8080) must match scripts/port-forward.sh's own
# APPS map — update both together if that map ever changes. The hostname itself is this specific
# tailnet node's DNSName (`tailscale status --self --json`), stable unless the device is renamed.
grafana:
  rootUrl: https://${tailscale_hostname}:8085/
  authUrl: https://${tailscale_hostname}:8080/application/o/authorize/
