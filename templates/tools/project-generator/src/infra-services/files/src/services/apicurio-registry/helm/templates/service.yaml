apiVersion: v1
kind: Service
metadata:
  name: apicurio-registry
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "apicurioRegistry.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "apicurioRegistry.labels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
