apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      {{- include "prometheus.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prometheus.labels" . | nindent 8 }}
    spec:
      # See services/terraform/CLAUDE.md's "enableServiceLinks: false is required on the Schema
      # Registry pod, not optional" note — applied defensively to every component here too.
      enableServiceLinks: false
      # Needed now: kubernetes_sd_config (role: node) in prometheus.yml discovers kubelets to
      # scrape /metrics/cadvisor from, and the mounted token authenticates those requests — see
      # prometheus-rbac.yaml for the matching ClusterRole.
      serviceAccountName: prometheus
      automountServiceAccountToken: true
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image }}"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 512Mi
          args:
            - --config.file=/etc/prometheus/config/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Both flags needed: OtelPlugin's direct OTLP push needs --web.enable-otlp-receiver,
            # Tempo's metrics_generator remote_write (see helm/files/tempo.yaml) needs
            # --web.enable-remote-write-receiver below.
            - --web.enable-otlp-receiver
            - --web.enable-remote-write-receiver
            # /-/reload, POSTed by the config-reloader sidecar below whenever prometheus.yml
            # actually changes on disk.
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            # Whole directory, not subPath: true — a subPath-mounted ConfigMap key never
            # live-updates on `kubectl apply`/`helm upgrade` (a known kubelet limitation, the
            # symlink swap that makes ordinary ConfigMap volumes self-refresh only happens at the
            # mount root). Every scrape-config edit this stack has made was silently invisible to
            # the running Prometheus process until a manual pod restart for exactly this reason —
            # mounting the directory lets kubelet's normal periodic refresh (~1 min) update the
            # file in place, and the config-reloader sidecar below turns that file change into an
            # actual live reload.
            - name: config
              mountPath: /etc/prometheus/config
            - name: data
              mountPath: /prometheus
            # meilisearch job needs a bearer token to read /metrics — mounts
            # services/meilisearch's own master-key Secret directly (same "infra" namespace)
            # rather than duplicating it, so a rotated token is picked up on next pod restart with
            # no separate credential to keep in sync.
            - name: meilisearch-token
              mountPath: /etc/prometheus/secrets/meilisearch
              readOnly: true
        # Watches the mounted ConfigMap directory and POSTs /-/reload whenever it actually
        # changes — without this, --web.enable-lifecycle above has nothing to trigger it, since
        # Prometheus itself never watches its own config file for changes.
        - name: config-reloader
          image: quay.io/prometheus-operator/prometheus-config-reloader:v0.93.0
          args:
            - --watched-dir=/etc/prometheus/config
            - --reload-url=http://localhost:9090/-/reload
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: meilisearch-token
          secret:
            secretName: meilisearch-secret
            items:
              - key: MEILI_MASTER_KEY
                path: token
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.prometheus.persistence.size }}
