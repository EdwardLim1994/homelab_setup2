apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "grafana.labels" . | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
