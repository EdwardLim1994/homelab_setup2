apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "alloy.labels" . | nindent 4 }}
---
# discovery.kubernetes (role: pod) in alloy-config.alloy needs to list/watch pods to attach
# namespace/pod/container labels to each log line.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.namespace }}-alloy-pod-read
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.namespace }}-alloy-pod-read
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.namespace }}-alloy-pod-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "alloy.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "alloy.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "alloy.labels" . | nindent 8 }}
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: "{{ .Values.alloy.image }}"
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            # Whole directory, not subPath — see prometheus-statefulset.yaml's comment for why a
            # subPath-mounted ConfigMap key never live-updates.
            - name: config
              mountPath: /etc/alloy
            # Kubelet's own log directory (see alloy-config.alloy's __path__) — read-only, this
            # DaemonSet only ever tails it.
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: data
          emptyDir: {}
