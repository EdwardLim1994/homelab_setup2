apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meilisearch
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "meilisearch.labels" . | nindent 4 }}
spec:
  serviceName: meilisearch
  replicas: 1
  selector:
    matchLabels:
      {{- include "meilisearch.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "meilisearch.labels" . | nindent 8 }}
    spec:
      # See services/kafka/helm/templates/schema-registry-deployment.yaml's comment (also applied
      # to redis/apollo-router) — an auto-injected <SVC>_PORT env var has crashed at least one
      # image outright in this cluster; disabling Service env var injection here too avoids
      # relying on the meilisearch image never hitting a similar collision.
      enableServiceLinks: false
      # No use of the Kubernetes API from within this pod.
      automountServiceAccountToken: false
      containers:
        - name: meilisearch
          image: "{{ .Values.image }}"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 512Mi
          ports:
            - name: meilisearch
              containerPort: 7700
          env:
            - name: MEILI_ENV
              value: development
            # Native /metrics endpoint (Prometheus format), gated behind an API key with the
            # "metrics.get" action — the master key already qualifies, no separate key needed.
            - name: MEILI_EXPERIMENTAL_METRICS
              value: "true"
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: meilisearch-secret
                  key: MEILI_MASTER_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: meilisearch
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: meilisearch
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /meili_data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
