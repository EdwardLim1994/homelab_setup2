# Registers the tailnet hostname as a real Traefik route to authentik-server — see
# templates/ingress.yaml's own comment. Without this, every request below that resolves this
# hostname via a hostAliases entry (minio's own statefulset.yaml) still
# 404s at Traefik: a hostAliases-resolved connection alone only gets it as far as the ClusterIP,
# not past Traefik's own Host-based routing.
extraIngressHosts:
  - ${tailscale_hostname}

# Layered on top of values.yaml (see services/terraform/main.tf) alongside
# services/monitoring/helm/values-tailscale.yaml — Grafana's rootUrl there is overridden to the
# tailscale tunnel scripts/port-forward.sh opens, so Authentik's grafana-provider needs a
# matching redirect_uri or the OAuth callback fails with "Invalid redirect URI" after login.
#
# Helm list values replace rather than merge — this repeats values.yaml's four LAN entries
# alongside the new one rather than losing them, so LAN-direct login keeps working too.
grafanaRedirectUris:
  - http://grafana.localhost/login/generic_oauth
  - http://grafana.lan/login/generic_oauth
  - http://grafana.lan:8080/login/generic_oauth
  - https://grafana.lan:8443/login/generic_oauth
  # Must match services/monitoring/helm/values-tailscale.yaml's grafana.rootUrl exactly.
  - https://${tailscale_hostname}:8085/login/generic_oauth

# Must match services/minio/helm/values-tailscale.yaml's redirectUri exactly. Port 8095 —
# scripts/port-forward.sh's own APPS map.
minioRedirectUris:
  - http://minio.localhost/oauth_callback
  - http://minio.lan/oauth_callback
  - http://minio.lan:8080/oauth_callback
  - https://minio.lan:8443/oauth_callback
  - https://${tailscale_hostname}:8095/oauth_callback
