apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
data:
  # Real copy of services/monitoring/config/prometheus.yml — Helm's .Files.Get can only read
  # files inside the chart's own directory tree. Re-copy manually after editing the source.
  prometheus.yml: |
{{ .Files.Get "files/prometheus.yml" | indent 4 }}
