# Turns "is this workload up" into a metric for every Deployment/StatefulSet in the cluster at
# once (kube_deployment_status_replicas_ready, kube_statefulset_status_replicas_ready) — the only
# way to get a generic, per-service up/down signal for services with no app-level Prometheus
# metrics of their own (traefik, authentik, minio, apicurio-registry, cert-manager, otel-collector,
# loki, tempo, grafana) without wiring bespoke scraping/auth into each of those charts individually.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kubeStateMetrics.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.namespace }}-kube-state-metrics-read
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.namespace }}-kube-state-metrics-read
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.namespace }}-kube-state-metrics-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kubeStateMetrics.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kubeStateMetrics.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeStateMetrics.labels" . | nindent 8 }}
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: "{{ .Values.kubeStateMetrics.image }}"
          # Limits what it watches to the resource kinds this stack actually queries — the
          # default build watches everything it knows about, most of which this cluster has no
          # use for.
          args:
            - --resources=pods,deployments,statefulsets,nodes
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          ports:
            - name: http-metrics
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kubeStateMetrics.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kubeStateMetrics.labels" . | nindent 4 }}
  ports:
    - name: http-metrics
      port: 8080
      targetPort: 8080
