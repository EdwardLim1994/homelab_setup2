apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
stringData:
  MINIO_ROOT_USER: {{ .Values.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.rootPassword | quote }}
  # OIDC config URL is fetched by MinIO itself, server-side, but its response fields (authorization
  # endpoint etc.) get handed straight to the browser as a redirect target — so this must resolve
  # to the same browser-reachable authority Authentik issues those URLs from (see statefulset.yaml's
  # hostAliases), not the in-cluster Service DNS name. .lan (not .localhost) because this is being
  # driven from a LAN device — "*.localhost" always resolves to 127.0.0.1 per RFC 6761, no DNS
  # override can point it anywhere else, so a LAN device needs ".lan" instead. :8080 matches the temporary
  # `kubectl port-forward -n infra svc/traefik --address 0.0.0.0 8080:80 8443:443` used for LAN
  # device access — Authentik echoes back the exact Host header it received, port included, so
  # this needs it too, not just the browser-facing REDIRECT_URI below. Drop both ports (or point
  # this elsewhere) once that port-forward is no longer running. Values-driven (see values.yaml's
  # oidcConfigUrl/redirectUri) so an overlay like values-tailscale.yaml can point both at the
  # tailnet tunnel for off-LAN devices without editing this file.
  MINIO_IDENTITY_OPENID_CONFIG_URL: {{ .Values.oidcConfigUrl | quote }}
  MINIO_IDENTITY_OPENID_CLIENT_ID: "minio"
  MINIO_IDENTITY_OPENID_CLIENT_SECRET: {{ .Values.oidcClientSecret | quote }}
  MINIO_IDENTITY_OPENID_CLAIM_NAME: "policy"
  MINIO_IDENTITY_OPENID_SCOPES: "openid,profile,email,minio"
  # https:8443 — the browser-facing callback minio itself sends as redirect_uri; must be one of
  # authentik's registered minio-provider redirect_uris. Unlike CONFIG_URL above, this only needs
  # to be *a* valid callback address, not match whatever scheme the discovery fetch used.
  MINIO_IDENTITY_OPENID_REDIRECT_URI: {{ .Values.redirectUri | quote }}
  MINIO_IDENTITY_OPENID_DISPLAY_NAME: "Authentik"
