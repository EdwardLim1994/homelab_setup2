# Lets in-cluster clients (see services/minio/helm/templates/statefulset.yaml's hostAliases)
# reach Traefik's web entrypoint on port 8080 — matching the external
# `kubectl port-forward -n infra svc/traefik --address 0.0.0.0 8080:80 8443:443` used for LAN
# device access. Without this, a server-side request built from a URL with an explicit ":8080"
# authority (needed so Authentik's returned URLs also carry ":8080" for the browser) can't
# actually connect, since the chart's own Service only listens on 80/443. Purely additive: same
# pods, same "web" entrypoint, just a second Service port number. Temporary; remove once LAN
# access is no longer needed.
apiVersion: v1
kind: Service
metadata:
  name: traefik-web-8080
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: "traefik-{{ .Release.Namespace }}"
    app.kubernetes.io/name: traefik
  ports:
    - name: web-8080
      port: 8080
      targetPort: web
