apiVersion: v1
kind: Secret
metadata:
  name: unleash-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "unleash.labels" . | nindent 4 }}
stringData:
  # unleash-postgresql: bitnami's own `{{ .Release.Name }}-{{ .Chart.Name }}` Service naming,
  # same convention as authentik-postgresql (see services/authentik/helm's own bundled Postgres).
  DATABASE_HOST: "unleash-postgresql"
  DATABASE_PORT: "5432"
  DATABASE_NAME: {{ .Values.postgresql.auth.database | quote }}
  DATABASE_USERNAME: {{ .Values.postgresql.auth.username | quote }}
  DATABASE_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  DATABASE_SSL: {{ .Values.databaseSsl | quote }}
