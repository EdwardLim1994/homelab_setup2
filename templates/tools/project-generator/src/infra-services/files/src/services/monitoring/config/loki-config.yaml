auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Native OTLP log ingestion (POST /otlp/v1/logs) is enabled by default in Loki 3.x — no extra
  # flag needed. Left here as the anchor point for that behavior in case per-attribute label
  # mapping needs customizing later (see services/monitoring/CLAUDE.md).
  allow_structured_metadata: true

ruler:
  alertmanager_url: http://localhost:9093
