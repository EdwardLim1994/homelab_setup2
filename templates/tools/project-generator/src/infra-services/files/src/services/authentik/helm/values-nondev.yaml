# Layered on top of values.yaml for any non-dev apply (services/terraform's
# `environment != "dev"` — sit, uat, staging, prod).
#
# Deliberately doesn't repeat secret_key/postgresql.password/bootstrap password here — leaving
# them at values.yaml's dev placeholders would do nothing anyway, since services/terraform's
# helm_release "service" resource applies its authentik-only set_sensitive block (sourced from
# the terraform-only, no-default authentik_secret_key/authentik_postgres_password/
# authentik_bootstrap_password variables) after every `values` file, and Helm/Terraform's own
# precedence always lets an explicit `set`/`set_sensitive` win over anything from a values file.
# Real values live in whatever terraform.tfvars/CI secret store supplies those three variables at
# apply time — never in a chart file, dev or otherwise.
authentik:
  postgresql:
    primary:
      persistence:
        size: 10Gi
      # goauthentik's own default values.yaml (services/authentik/helm/charts/authentik-*.tgz's
      # postgresql.primary.configuration/primary.args) already points postgres at this exact
      # static config file, bypassing bitnami's own tls.enabled-driven env-var config generation
      # entirely — tls.enabled/autoGenerated below still mints+mounts a cert at
      # /opt/bitnami/postgresql/certs/{tls.crt,tls.key} (see the postgresql subchart's own
      # postgresql.v1.tlsCert/tlsCertKey helpers), it just never gets turned on without these
      # three lines. Full copy of goauthentik's own default block (Helm values don't merge
      # multi-line string scalars) plus the three ssl lines at the end.
      configuration: |
        listen_addresses = '*'
        port = '5432'
        wal_level = 'replica'
        fsync = 'on'
        hot_standby = 'on'
        log_connections = 'false'
        log_disconnections = 'false'
        log_hostname = 'false'
        client_min_messages = 'error'
        include_dir = 'conf.d'
        ssl = 'on'
        ssl_cert_file = '/opt/bitnami/postgresql/certs/tls.crt'
        ssl_key_file = '/opt/bitnami/postgresql/certs/tls.key'
    # Turns on wire encryption for the DB connection on any non-dev cluster (general hygiene, not
    # required by anything downstream since authentik's DB credential is a static password —
    # see terraform.tfvars' authentik_postgres_password, no dynamic-credential provisioner
    # in the mix here anymore).
    # autoGenerated: the bitnami chart mints its own self-signed cert via Helm's own
    # genSelfSignedCert (no openssl/bitnami-image dependency, works fine even though
    # goauthentik's own default values.yaml points postgresql.image at plain
    # docker.io/library/postgres instead of a real bitnami image) — at the cost of only getting
    # "require" (encrypted), not "verify-full" (authenticated) — see that same values-nondev.yaml
    # comment for what closing that gap needs.
    tls:
      enabled: true
      autoGenerated: true
