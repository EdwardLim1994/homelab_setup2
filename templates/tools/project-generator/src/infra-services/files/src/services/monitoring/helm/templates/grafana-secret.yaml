apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
stringData:
  GF_SECURITY_ADMIN_USER: {{ .Values.grafana.adminUser | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ .Values.grafana.adminPassword | quote }}
  GF_SERVER_ROOT_URL: {{ .Values.grafana.rootUrl | quote }}
  GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
  GF_AUTH_GENERIC_OAUTH_NAME: "Authentik"
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: {{ .Values.grafana.oidcClientSecret | quote }}
  GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
  # AUTH_URL is where Grafana redirects the *browser* — has to be an address the browser can
  # reach (LAN "authentik.lan" or, per values-tailscale.yaml, the tailscale tunnel), unaffected
  # by whatever Grafana's own backend uses below. TOKEN_URL/API_URL are server-to-server (this
  # pod fetching the token/userinfo itself) — calling authentik-server's own in-cluster Service
  # DNS name directly, not "authentik.lan" through Traefik: that hostname used to need a
  # hostAliases entry resolved via a Helm `lookup` of Traefik's ClusterIP, which could silently
  # fall back to 127.0.0.1 and break token exchange ("Failed to get token from provider") if that
  # lookup ever missed — not a real requirement in the first place, since these two calls never
  # needed Traefik's Host-based routing to begin with.
  GF_AUTH_GENERIC_OAUTH_AUTH_URL: {{ .Values.grafana.authUrl | quote }}
  GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://authentik-server.{{ .Values.namespace }}.svc.cluster.local/application/o/token/"
  GF_AUTH_GENERIC_OAUTH_API_URL: "http://authentik-server.{{ .Values.namespace }}.svc.cluster.local/application/o/userinfo/"
  GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
  # ponytail: every authenticated user becomes a Grafana org Admin — matches minio-provider's
  # consoleAdmin-for-everyone default (see the blueprint's minio-policy-mapping comment). Switch
  # to GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH reading the "groups" claim if per-user roles are
  # ever needed.
  #
  # GF_USERS_..., not GF_AUTH_GENERIC_OAUTH_...: auto_assign_org_role is a [users]-section (i.e.
  # global, every auth method) setting in Grafana, not a per-provider [auth.generic_oauth] one —
  # confirmed against /usr/share/grafana/conf/defaults.ini inside the running container, the
  # previous GF_AUTH_GENERIC_OAUTH_AUTO_ASSIGN_ORG_ROLE key doesn't exist anywhere in Grafana's
  # config schema, so it was silently ignored (Grafana doesn't error on unrecognized env vars)
  # and every OIDC login landed on the real default, [users]'s own "Viewer" — hence no Explore
  # menu, that role can't see it.
  GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Admin"
