apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
---
# Cluster-scoped: kubelet cadvisor scraping (prometheus.yml's kubernetes_sd_config, role: node)
# needs to list/watch nodes and hit each kubelet's /metrics/cadvisor — that's node discovery +
# a nodes/proxy-equivalent read, which has no namespaced form.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.namespace }}-prometheus-node-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.namespace }}-prometheus-node-read
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.namespace }}-prometheus-node-read
  apiGroup: rbac.authorization.k8s.io
