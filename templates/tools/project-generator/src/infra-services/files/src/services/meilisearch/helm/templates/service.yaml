apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "meilisearch.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "meilisearch.labels" . | nindent 4 }}
  ports:
    - name: meilisearch
      port: 7700
      targetPort: meilisearch
