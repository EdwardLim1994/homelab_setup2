apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "loki.labels" . | nindent 4 }}
data:
  # Real copy of services/monitoring/config/loki-config.yaml — see prometheus-configmap.yaml's
  # comment for why (Helm .Files.Get chart-directory restriction).
  local-config.yaml: |
{{ .Files.Get "files/loki-config.yaml" | indent 4 }}
