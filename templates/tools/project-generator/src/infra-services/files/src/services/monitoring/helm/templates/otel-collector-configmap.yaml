apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "otelCollector.labels" . | nindent 4 }}
data:
  # Real copy of services/monitoring/config/otel-collector-config.yaml — see
  # prometheus-configmap.yaml's comment for why (Helm .Files.Get chart-directory restriction).
  # References tempo/prometheus/loki by plain Service name — resolves fine as-is in-cluster, same
  # namespace, no FQDN rewrite needed.
  otel-collector-config.yaml: |
{{ .Files.Get "files/otel-collector-config.yaml" | indent 4 }}
