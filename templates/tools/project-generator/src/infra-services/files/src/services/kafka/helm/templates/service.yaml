apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  # Headless (not a normal ClusterIP) — required for the StatefulSet's per-pod stable DNS
  # (kafka-0.kafka.{{ .Values.namespace }}.svc.cluster.local, used by KRaft's
  # KAFKA_CONTROLLER_QUORUM_VOTERS). The plain kafka.{{ .Values.namespace }}.svc.cluster.local
  # form also resolves through this same headless Service — fine for a single broker, so this
  # doubles as the client-facing address too, with no separate ClusterIP Service needed.
  clusterIP: None
  selector:
    {{- include "kafka.labels" . | nindent 4 }}
  ports:
    - name: plaintext
      port: 9092
    - name: controller
      port: 9093
    - name: metrics
      port: 9308
