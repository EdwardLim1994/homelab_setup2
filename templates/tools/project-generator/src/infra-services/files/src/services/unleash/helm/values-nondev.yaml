# Layered on top of values.yaml for any non-dev apply (services/terraform's
# `environment != "dev"` — sit, uat, staging, prod).
databaseSsl: true

postgresql:
  primary:
    persistence:
      size: 10Gi
  # Same story as authentik/helm/values-nondev.yaml's own bundled-Postgres TLS: bitnami's chart
  # mints its own self-signed cert — "require" (encrypted), not "verify-full" (authenticated).
  tls:
    enabled: true
    autoGenerated: true
