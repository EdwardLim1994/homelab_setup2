apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "otelCollector.labels" . | nindent 4 }}
spec:
  # Stateless (no PVC, unlike prometheus/loki/tempo/grafana's StatefulSets) — same reasoning as
  # apollo-router's Deployment: nothing here needs stable per-pod identity or persistent storage.
  replicas: 1
  selector:
    matchLabels:
      {{- include "otelCollector.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "otelCollector.labels" . | nindent 8 }}
    spec:
      enableServiceLinks: false
      # No use of the Kubernetes API from within this pod.
      automountServiceAccountToken: false
      containers:
        - name: otel-collector
          image: "{{ .Values.otelCollector.image }}"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 256Mi
          args:
            - --config=/etc/otel-collector-config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            tcpSocket:
              port: otlp-grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: otlp-grpc
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/otel-collector-config.yaml
              subPath: otel-collector-config.yaml
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
