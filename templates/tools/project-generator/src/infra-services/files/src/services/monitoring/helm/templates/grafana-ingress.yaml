# No forward-auth middleware here — Grafana gates itself via native OIDC login against Authentik
# (see services/authentik/helm/templates/proxy-blueprint-configmap.yaml's grafana-provider), same
# as minio.localhost (see services/minio/helm/templates/ingress.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
    - host: grafana.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
