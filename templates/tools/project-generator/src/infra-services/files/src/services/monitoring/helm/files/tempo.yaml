server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# Derives RED metrics (request rate/error/duration) and a service graph straight from ingested
# spans, remote-written into Prometheus — gives Grafana's "service graph"/"span metrics" panels
# something to query without hand-instrumenting metrics for the same thing OtelPlugin already
# traces. Requires Prometheus started with --web.enable-remote-write-receiver (see
# helm/templates/prometheus-statefulset.yaml's container args).
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
