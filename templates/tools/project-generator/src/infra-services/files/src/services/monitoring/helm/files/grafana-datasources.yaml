apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # Jump from a trace span straight to its logs/metrics in Grafana's trace view — correlates
      # on trace ID / service+duration, standard Tempo<->Loki/Prometheus wiring, nothing custom.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
      tracesToMetrics:
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
      # Matches tempo.yaml's metrics_generator (service-graphs/span-metrics), which remote-writes
      # into this same Prometheus instance.
      nodeGraph:
        enabled: true
