apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nodeExporter.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "nodeExporter.labels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
